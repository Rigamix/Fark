<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Pyre — in hand</title>
<style>
@font-face{font-family:'Alagard';src:url('../Fonts/Pixel/alagard.ttf') format('truetype')}
:root{
  --font-px:'Alagard','Press Start 2P',monospace;
  /* real in-match gold rarity vars */
  --ctrim:#5a3c00;--ctrim2:#e0b428;--cface:#160e00;--cface2:#241800;--ctxt:#ffe878;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%}
body{
  font-family:var(--font-px);color:#b8b0a0;overflow:hidden;position:fixed;inset:0;
  image-rendering:pixelated;-webkit-font-smoothing:none;background:#140a06;
}
/* the real match-screen scene */
#scene{position:absolute;inset:0;background:#140a06 url('../Environment_ART/match.png') center/cover no-repeat;}
#scene::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,6,3,.25) 0%,transparent 30%,transparent 60%,rgba(10,6,3,.55) 100%)}
.title{position:absolute;top:16px;left:0;right:0;text-align:center;z-index:50;
  font-family:var(--font-px);color:#ffe878;font-size:15px;letter-spacing:2px;text-shadow:0 2px 0 rgba(0,0,0,.7)}
.title small{display:block;color:#c0b498;font-size:10px;letter-spacing:1px;margin-top:5px;opacity:.85}
/* ── real card render ── */
.mcard{border-radius:5px;overflow:visible;image-rendering:pixelated}
.gcard{
  position:relative;width:100%;height:100%;border-radius:5px;overflow:hidden;
  background:linear-gradient(165deg,var(--cface2) 0%,var(--cface) 55%,var(--cface2) 100%);
  border:2px solid var(--ctrim2);
  box-shadow:inset 0 0 0 1px var(--ctrim),inset 0 0 0 4px var(--cface),inset 0 0 0 5px var(--ctrim2),0 5px 16px rgba(0,0,0,.85);
  isolation:isolate;
}
body.wobble .gcard{filter:url(#pixelWobbleLite)}
.gcard-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;image-rendering:pixelated;pointer-events:none}
.clbl{position:absolute;left:0;right:0;text-align:center;font-family:var(--font-px);font-size:11px;color:#ffe878;text-shadow:0 1px 2px #000;z-index:30}
/* HAND mode — authentic overlapping fan pinned to the bottom */
#hand{position:absolute;left:0;right:0;bottom:150px;height:0;z-index:20}
#hand.compare{position:absolute;inset:auto 0 0 0;height:auto;bottom:96px;display:flex;align-items:flex-end;justify-content:center;gap:10px;flex-wrap:wrap}
#hand .mcard{position:absolute;width:76px;height:106px;left:var(--cx,50%);margin-left:-38px;
  transform:translateY(calc(-50% - var(--lift,0px))) rotate(var(--rot,0deg));transform-origin:center}
#hand .mcard .clbl{top:-15px}
#hand.compare .mcard{position:relative;width:80px;height:112px;left:auto;margin:0;transform:none;transform-origin:bottom center}
#hand.compare .mcard .clbl{top:auto;bottom:-20px}
/* controls */
.controls{position:absolute;bottom:24px;left:0;right:0;z-index:60;display:flex;gap:10px;justify-content:center}
.btn{font-family:var(--font-px);font-size:12px;letter-spacing:1px;color:#c8a050;background:rgba(30,18,10,.92);
  border:2px solid #5a4428;border-radius:4px;padding:8px 12px;cursor:pointer}
.btn.on{color:#ffe878;border-color:#e0b428;background:#3a2810}
</style>
</head>
<body class="">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="pixelWobbleLite"><feTurbulence type="turbulence" baseFrequency="0.025" numOctaves="2" seed="5" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.0" xChannelSelector="R" yChannelSelector="G"/></filter>
</svg>

<div id="scene"></div>
<div class="title">STYLE TEST<small>three different cards · one pixel-art technique</small></div>
<div id="hand"></div>

<div class="controls">
  <button class="btn" id="bMode">VIEW: COMPARE</button>
  <button class="btn" id="bWobble">WOBBLE: OFF</button>
</div>

<script>
var hand=document.getElementById('hand');
var FILES=['Pyre07','FrozenDie01','CrowsLuck01'];
var N=FILES.length;
// real fan math (buildCBar): spread=min(56,220/n)
var spread=Math.min(56,220/N), totalW=spread*(N-1);
function render(){
  hand.innerHTML='';
  FILES.forEach(function(name,i){
    var t=(N===1)?0:(i/(N-1))*2-1;
    var rot=t*8, cx=50+(t*totalW/2)/3.75, lift=(1-t*t)*8;
    var m=document.createElement('div');
    m.className='mcard';
    m.style.setProperty('--rot',rot+'deg');
    m.style.setProperty('--cx',cx+'%');
    m.style.setProperty('--lift',lift+'px');
    m.style.zIndex=10+i;
    m.innerHTML='<div class="gcard"><img class="gcard-art" src="../Card_ART/'+name+'.png"></div>'
      +'<div class="clbl">'+name.replace(/([a-z])([A-Z])/g,'$1 $2').replace(/(\d+)/,' $1').toUpperCase()+'</div>';
    hand.appendChild(m);
  });
}
render();
hand.classList.add('compare');
var bMode=document.getElementById('bMode'),bWob=document.getElementById('bWobble');
bMode.addEventListener('click',function(){
  var cmp=hand.classList.toggle('compare');
  bMode.textContent='VIEW: '+(cmp?'COMPARE':'HAND');
  bMode.classList.toggle('on',!cmp);
});
bWob.addEventListener('click',function(){
  var on=document.body.classList.toggle('wobble');
  bWob.textContent='WOBBLE: '+(on?'ON':'OFF');
  bWob.classList.toggle('on',on);
});
</script>
</body>
</html>
