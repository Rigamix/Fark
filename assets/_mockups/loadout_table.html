<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fark! — Loadout mockup: AT THE TABLE (v3, game-faithful primitives)</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Press+Start+2P&family=Uncial+Antiqua&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════════════════════════
   MOCKUP v3 — "AT THE TABLE", rebuilt with the REAL game primitives
   extracted verbatim from index.html:
   - DICE: CSS 7x7 pip grid + real .dtype-bone/.dtype-iron material vars
   - CARDS: real .gcard framing (emoji over CARD_BG swatch, rarity trim,
            corner ornaments, pixelWobbleLite filter)
   - GOLD: real .coin-i radial-gradient disc ; HEARTS: ❤️ emoji
   - NAV: real Menu_Art/beer.png + Menu_Art/Shop.png at game sizes
   - BOSS BTN: real _bossBtnDef 3-tone (grog accent #ffc070)
   - FONT SIZES: real type scale (boss 24px, headers 10px, nav 13px…)
   ════════════════════════════════════════════════════════════════ */
@font-face{font-family:'Alagard';src:url('../Fonts/Pixel/alagard.ttf') format('truetype')}
:root{
  --bg:#0c0e16; --gold:#c8a050; --golddim:#5a4428; --red:#a05050;
  --text:#b8b0a0; --textdim:#68605a;
  --chalk:#f2ede1; --ghost:#9c8c74;
  --parch:#c3af8c; --parch-dk:#9b8764; --parch-edge:#786446;
  --accent:#ffc070;            /* grog */
  --accent-face:#47361f;       /* _hexShade(#ffc070,.28) */
  --accent-shadow:#241b10;     /* _hexShade(#ffc070,.14) */
  --accent-bevel-dk:#dc9d4d;   /* accent - 35/ch (bottom/right bevel) */
  --font-px:'Alagard','Press Start 2P',monospace;
  --font-rp:'Uncial Antiqua',serif;
}
/* ── die material palettes (index.html:711-729) ── */
.dtype-bone{--dborder:#a89882;--dface:#d8ccb4;--dface3:#c0b49a;--dhigh:#f5ece0;--dpip:#5a4a38;--ddither:rgba(180,160,130,.18)}
.dtype-iron{--dborder:#6a6e74;--dface:#4a4e56;--dface3:#36393f;--dhigh:#7a7e86;--dpip:#c8ccd2;--ddither:rgba(140,150,170,.15)}
/* ── card rarity vars (loadout-screen copy index.html:3937-3940 + boss-grog 4851) ── */
.rarity-tin{--ctrim:#3d352c;--ctrim2:#7a6e5c;--cface:#18140f;--cface2:#221e18;--ctxt:#c0b498}
.rarity-silver{--ctrim:#3a404a;--ctrim2:#6a7080;--cface:#0e1018;--cface2:#161a22;--ctxt:#c4c8d4}
.rarity-gold{--ctrim:#5a3c00;--ctrim2:#a08030;--cface:#160e00;--cface2:#241800;--ctxt:#ffe878}
.rarity-boss-grog{--ctrim:#3a2810;--ctrim2:#c09040;--cface:#1a1008;--cface2:#2a1810;--ctxt:#ffc070}
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html{background:#1e120a}
body{
  font-family:var(--font-px);color:var(--text);
  overflow:hidden;position:fixed;inset:0;
  display:flex;justify-content:center;
  image-rendering:pixelated;-webkit-font-smoothing:none;
}
#stage{
  position:relative;width:100%;max-width:430px;height:100vh;height:100dvh;
  overflow:hidden;background:#1e120a;
}
/* ── the real game scene: bench + table ── */
#stage::before{
  content:'';position:absolute;inset:0;z-index:0;
  background-image:url('../Environment_ART/loadout.png');
  background-size:cover;background-position:center top;background-repeat:no-repeat;
}
#stage::after{
  content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 42%,transparent 55%,rgba(8,4,2,.55) 100%);
}
/* ════════ TOP BAR — real gauntlet HUD ════════ */
.topbar{
  position:absolute;top:0;left:0;right:0;z-index:30;
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:11px 12px 0;pointer-events:none;
}
/* renown: ⭐ + bar (real fill #dca84a→#ffd870) */
.renown{display:flex;align-items:center;gap:6px}
.renown .star{font-size:14px;line-height:1.2;filter:drop-shadow(0 1px 0 rgba(0,0,0,.6))}
.renown .bar{width:60px;height:6px;background:rgba(0,0,0,.5);border:1px solid rgba(220,168,74,.4);border-radius:3px;overflow:hidden}
.renown .bar i{display:block;width:34%;height:100%;background:linear-gradient(90deg,#dca84a,#ffd870)}
.renown .rk{font-size:11px;color:#dca84a;letter-spacing:1px}
/* gold pill: hearts | divider | coin + amount  (real #tierGoldPill) */
.goldpill{display:flex;align-items:center;gap:8px;font-family:var(--font-px);font-size:13px;color:var(--gold);letter-spacing:1px;text-shadow:1px 1px 0 rgba(0,0,0,.6)}
.hearts{display:flex;align-items:center;gap:2px}
.hearts .h{font-size:13px;line-height:1;display:inline-block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.55))}
.divider{width:1px;height:14px;background:rgba(200,160,80,.35);display:inline-block}
.gp-coin{display:flex;align-items:center;gap:4px}
.coin-i{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-1px;
  background:radial-gradient(circle at 38% 35%,#ffe080 0%,#d4a840 50%,#a07820 100%);
  border:1.5px solid #8a6820;box-shadow:inset 0 -1px 0 rgba(0,0,0,.3),inset 0 1px 0 rgba(255,240,180,.35);
  image-rendering:pixelated;flex-shrink:0}
/* ════════ WALL ZONE — chalk ════════ */
.tally{position:absolute;top:46px;left:16px;z-index:10}
.tally svg{display:block}
.tally .lbl{font-size:9px;color:rgba(200,160,80,.45);letter-spacing:1.5px;margin-top:4px;text-transform:uppercase}
.tally .lbl b{color:var(--accent);font-weight:normal}
.ledger{position:absolute;top:104px;left:16px;z-index:10;font-size:10px;line-height:1.9;color:var(--ghost);letter-spacing:1px}
.ledger .row{display:flex;gap:8px;align-items:center}
.ledger .who{width:40px;color:rgba(220,190,140,.75)}
.ledger svg{vertical-align:middle}
/* ── THE INNKEEP'S BOOK — hanging chalkboard (designed feature) ── */
.book{
  position:absolute;top:38px;right:8px;z-index:9;width:132px;
  cursor:pointer;transform:rotate(2deg);transform-origin:top center;
  transition:transform .25s ease;
}
.book:active{transform:rotate(3.5deg) scale(.985)}
.book .nail{position:absolute;top:-10px;left:50%;width:4px;height:4px;background:#777;border-radius:50%;transform:translateX(-50%);box-shadow:0 1px 0 #000}
.book .strings{position:absolute;top:-8px;left:18%;right:18%;height:14px;
  background:
    linear-gradient(to bottom right,transparent calc(50% - 1px),#8a7a5a calc(50% - 1px),#8a7a5a calc(50% + 0px),transparent calc(50% + 1px)) left/50% 100% no-repeat,
    linear-gradient(to bottom left,transparent calc(50% - 1px),#8a7a5a calc(50% - 1px),#8a7a5a calc(50% + 0px),transparent calc(50% + 1px)) right/50% 100% no-repeat;
}
.book .frame{
  background:#4a3420;border:3px solid #5f4730;border-radius:3px;
  box-shadow:inset 0 0 0 1px #2c1d10,0 4px 10px rgba(0,0,0,.55);
  padding:4px;
}
.book .slate{
  background:
    radial-gradient(ellipse at 30% 30%,rgba(255,255,255,.045),transparent 60%),
    #20261f;
  border:1px solid #161a15;padding:8px 6px 7px;text-align:center;
}
.book .bk-title{font-size:9px;letter-spacing:1px;color:var(--chalk);opacity:.85;border-bottom:1px solid rgba(242,237,225,.25);padding-bottom:4px;margin-bottom:5px}
.book .bk-odds-l{font-size:8px;letter-spacing:2px;color:var(--ghost)}
.book .bk-odds{font-size:22px;color:var(--chalk);letter-spacing:3px;margin:1px 0 3px;text-shadow:0 0 6px rgba(242,237,225,.25)}
.book .bk-stake{font-size:10px;color:var(--ghost)}
.book .bk-stake b{color:var(--gold);font-weight:normal}
.book .bk-hint{font-family:'IM Fell English',serif;font-style:italic;font-size:10px;color:var(--ghost);margin-top:5px;opacity:.8}
.book .stamp{
  display:none;position:absolute;inset:auto 6px 26px 6px;z-index:3;
  font-size:12px;letter-spacing:1px;color:var(--chalk);text-align:center;
  border:2px solid var(--chalk);border-radius:3px;padding:3px 0;
  transform:rotate(-6deg);background:rgba(32,38,31,.85);
}
.book.placed .stamp{display:block;animation:stampIn .25s cubic-bezier(.2,1.6,.4,1) both}
.book.placed .bk-odds,.book.placed .bk-odds-l,.book.placed .bk-stake{opacity:.32}
.book.placed .bk-hint{visibility:hidden}
@keyframes stampIn{0%{transform:rotate(-6deg) scale(1.6);opacity:0}100%{transform:rotate(-6deg) scale(1);opacity:1}}
/* ── GROG — seated, overlapping the table edge ── */
.grog{
  position:absolute;z-index:8;left:50%;top:21%;
  width:min(58vw,240px);transform:translateX(-50%);
  pointer-events:none;
}
.grog img{
  width:100%;display:block;image-rendering:pixelated;
  filter:drop-shadow(0 4px 0 rgba(0,0,0,.45));
  animation:sway 5.5s ease-in-out infinite;transform-origin:bottom center;
}
@keyframes sway{0%,100%{transform:rotate(-.6deg)}50%{transform:rotate(.8deg)}}
/* real .tier-boss-name: 24px #e06050 ls4 */
.grog .name{
  position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);z-index:9;
  font-family:var(--font-px);font-size:24px;letter-spacing:4px;color:#e06050;
  text-shadow:0 2px 0 rgba(0,0,0,.5);
}
/* ── TELL — real boss-tell caption (index.html:2794-2796 .tbt-name/.tbt-desc) ── */
.tell{
  position:absolute;z-index:7;left:4%;right:4%;top:60%;text-align:center;pointer-events:none;
}
.tell .t-name{font-family:var(--font-px);font-size:13px;letter-spacing:1px;color:#ecbc66;text-shadow:0 2px 5px rgba(0,0,0,.85)}
.tell .t-name .rule{color:#e0545c}
.tell .t-quote{font-family:'IM Fell English',serif;font-style:italic;font-size:13.5px;line-height:1.35;color:#e0d2b6;text-shadow:0 2px 5px rgba(0,0,0,.85);margin-top:2px}
/* ════════ TABLE ZONE ════════ */
#table{position:absolute;left:0;right:0;z-index:6;top:39.5%;height:34%;}
#table::before{content:'';position:absolute;inset:-4% -10%;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at 52% 40%,rgba(255,200,120,.10),transparent 65%)}
.obj{position:absolute;z-index:2;cursor:pointer;transition:transform .12s ease}
.obj:active{transform:scale(1.07)!important}
/* ── real DICE: 7x7 CSS pip grid (index.html:977,711-729,2528-2530) ── */
.die{
  display:grid;
  background:var(--dface);
  border:3px solid var(--dborder);
  border-top-color:var(--dhigh);border-left-color:var(--dhigh);
  border-right-color:var(--dface3);border-bottom-color:var(--dface3);
  border-radius:3px;
  box-shadow:3px 4px 0 rgba(30,18,8,.45),4px 5px 0 rgba(30,18,8,.2);
}
.die::after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:2px;
  background:repeating-conic-gradient(var(--ddither) 0% 25%,transparent 0% 50%) 0 0/4px 4px;
  image-rendering:pixelated;mix-blend-mode:overlay}
.dc{width:100%;height:100%}
.dc.dot{background:var(--dpip);border-radius:0}
/* size variants — outer chosen so (outer-6)/7 = whole-px cells */
.die.d48{width:48px;height:48px;grid-template-columns:repeat(7,6px);grid-template-rows:repeat(7,6px)}
.die.d48 .dc.dot{width:4px;height:4px;margin:1px}
.die.d41{width:41px;height:41px;grid-template-columns:repeat(7,5px);grid-template-rows:repeat(7,5px)}
.die.d41 .dc.dot{width:3px;height:3px;margin:1px}
.die.d34{width:34px;height:34px;grid-template-columns:repeat(7,4px);grid-template-rows:repeat(7,4px);border-width:2px;box-shadow:2px 3px 0 rgba(30,18,8,.45),3px 4px 0 rgba(30,18,8,.2)}
.die.d34 .dc.dot{width:2px;height:2px;margin:1px}
/* ── real CARDS: .lo-mini-card + .gcard (index.html:3942-3994,4859-4885) ── */
.card-obj{filter:drop-shadow(0 3px 5px rgba(0,0,0,.75))}
.card-obj::before{content:'';position:absolute;inset:-14px -10px;z-index:-1;pointer-events:none;
  border-radius:50%;background:radial-gradient(ellipse,rgba(200,144,60,.32) 0%,transparent 66%)}
.card-obj .lo-mini-card{
  width:56px;aspect-ratio:2/3;border-radius:4px;overflow:hidden;position:relative;
}
.gcard{
  width:100%;height:100%;position:relative;overflow:hidden;
  border:2px solid var(--ctrim);border-radius:4px;
  background:linear-gradient(165deg,var(--cface2) 0%,var(--cface) 100%);
  box-shadow:inset 0 0 0 1px var(--ctrim2);
  isolation:isolate;filter:url(#pixelWobbleLite);
}
.gcard-cover{position:absolute;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;
  font-size:30px;line-height:1;border-radius:3px}
.gcard-frame{position:absolute;top:3px;left:3px;right:3px;bottom:3px;border-radius:2px;
  pointer-events:none;z-index:1;border:1px solid var(--ctrim2);opacity:.7}
.gc{position:absolute;z-index:2;pointer-events:none;width:9px;height:9px;color:var(--ctrim2);overflow:visible;
  filter:drop-shadow(0 0 2px var(--ctrim2))}
.gc.tl{top:3px;left:3px}
.gc.tr{top:3px;right:3px;transform:scaleX(-1)}
.gc.bl{bottom:3px;left:3px;transform:scaleY(-1)}
.gc.br{bottom:3px;right:3px;transform:scale(-1,-1)}
.scrawl{position:absolute;font-family:'IM Fell English',serif;font-style:italic;
  font-size:11px;color:rgba(156,140,116,.55);pointer-events:none;letter-spacing:.5px}
.pouch{position:absolute;cursor:pointer;z-index:3}
.pouch img{width:60px;image-rendering:pixelated;filter:drop-shadow(0 3px 3px rgba(0,0,0,.5))}
.pouch .badge{
  position:absolute;bottom:2px;right:-2px;font-family:var(--font-px);
  font-size:11px;color:var(--gold);background:rgba(30,20,10,.92);
  border:1px solid rgba(180,140,70,.5);border-radius:3px;padding:1px 5px;
}
.pouch:active{transform:scale(.93)}
/* ════════ ACTION DOCK ════════ */
#dock{position:absolute;left:0;right:0;bottom:0;z-index:20;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;}
/* ── real boss button: _bossBtnDef 3-tone, grog accent ── */
.boss-wrap{width:86%;max-width:340px;padding:0 4px;margin-bottom:20px}
.challenge{
  position:relative;min-height:64px;padding:14px 10px 12px;border-radius:8px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--accent-face);
  border:3px solid var(--accent);
  border-right-color:var(--accent-bevel-dk);border-bottom-color:var(--accent-bevel-dk);
  box-shadow:0 0 0 1px var(--accent-shadow),0 4px 0 rgba(0,0,0,.5);
  transition:transform .06s ease,filter .06s ease;
}
.challenge:active{transform:scale(.97);filter:brightness(.9);box-shadow:0 0 0 1px var(--accent-shadow),0 1px 0 rgba(0,0,0,.5)}
.challenge .lbl{font-family:var(--font-px);font-size:16px;letter-spacing:1.5px;color:var(--accent);
  text-shadow:1px 1px 0 rgba(0,0,0,.55),-1px -1px 0 rgba(255,255,255,.07)}
.challenge .sub{font-family:var(--font-px);font-size:18px;color:#e8b830;margin-top:4px;letter-spacing:1px;text-shadow:1px 1px 0 rgba(0,0,0,.55)}
.challenge .sub.bet{font-size:10px;color:rgba(255,192,112,.7);letter-spacing:2px}
/* ── real bottom nav (index.html:3636-3657) ── */
.bottom-nav{
  width:100%;display:flex;justify-content:space-around;align-items:flex-end;
  padding:4px 0 calc(14px + env(safe-area-inset-bottom,0px));
  background:rgba(30,18,10,1);overflow:visible;position:relative;
}
.bottom-nav::before{
  content:'';position:absolute;left:0;right:0;bottom:100%;height:18px;pointer-events:none;z-index:-1;
  background:repeating-conic-gradient(rgba(30,18,10,1) 0% 25%, transparent 0% 50%) 0 0/4px 4px;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0%,transparent 30%,rgba(0,0,0,.3) 50%,rgba(0,0,0,.6) 70%,rgba(0,0,0,.85) 85%,black 100%);
  mask-image:linear-gradient(to bottom,transparent 0%,transparent 30%,rgba(0,0,0,.3) 50%,rgba(0,0,0,.6) 70%,rgba(0,0,0,.85) 85%,black 100%);
  image-rendering:pixelated;
}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:0 14px;border:none;background:none;transition:transform .06s}
.nav-btn:active{transform:scale(.9)}
.nav-btn .nav-icon{width:56px;height:56px;margin-top:-24px;object-fit:contain;image-rendering:auto;filter:drop-shadow(0 1px 0 rgba(0,0,0,.5))}
.nav-btn .nav-label{font-family:var(--font-px);font-size:13px;color:var(--textdim);letter-spacing:1px}
/* ════════ INSPECT POPOVER — game tooltip styling ════════ */
#pop{
  position:absolute;z-index:40;display:none;width:190px;
  background-image:linear-gradient(165deg,var(--cface2) 0%,var(--cface) 55%,var(--cface2) 100%);
  background-color:var(--cface,#111);
  border:2px solid var(--ctrim2);border-radius:6px;
  box-shadow:inset 0 0 0 1px var(--ctrim),inset 0 0 0 4px var(--cface),inset 0 0 0 5px var(--ctrim2),0 4px 16px rgba(0,0,0,1);
  font-family:var(--font-px);color:var(--ctxt);text-align:center;overflow:hidden;
}
#pop.show{display:block;animation:popIn .16s ease-out both}
@keyframes popIn{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
#pop .p-title{font-size:14px;color:var(--ctxt);letter-spacing:1px;line-height:1.1;padding:6px 10px 2px}
#pop .p-body{font-family:'IM Fell English',serif;font-size:13px;line-height:1.35;color:var(--ctrim2);padding:2px 10px 6px;text-wrap:balance}
.mote{position:absolute;width:2px;height:2px;background:rgba(255,220,160,.35);border-radius:50%;z-index:5;animation:drift 13s linear infinite}
@keyframes drift{0%{transform:translate(0,0);opacity:0}12%{opacity:.7}88%{opacity:.4}100%{transform:translate(-26px,-72px);opacity:0}}
@media (prefers-reduced-motion:reduce){.grog img,.mote{animation:none}}
</style>
</head>
<body>
<!-- pixel-wobble filter applied to every .gcard (index.html:6493) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="pixelWobbleLite"><feTurbulence type="turbulence" baseFrequency="0.025" numOctaves="2" seed="5" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.0" xChannelSelector="R" yChannelSelector="G"/></filter>
</svg>

<div id="stage">

  <!-- top bar -->
  <div class="topbar">
    <div class="renown"><span class="star">⭐</span><span class="bar"><i></i></span><span class="rk">KNOWN</span></div>
    <div class="goldpill">
      <span class="hearts"><span class="h">❤️</span><span class="h">❤️</span><span class="h">❤️</span></span>
      <span class="divider"></span>
      <span class="gp-coin"><span class="coin-i"></span><span id="gold">470</span>g</span>
    </div>
  </div>

  <!-- wall: boss tally (chalk, crisp) -->
  <div class="tally">
    <svg width="86" height="34" viewBox="0 0 86 34" shape-rendering="crispEdges">
      <g fill="none" stroke="#f2ede1" stroke-width="3" stroke-linecap="round">
        <path d="M6,4 L5,15 L7,26 L6,31"/>
        <path d="M20,4 L19,15 L21,26 L20,31"/>
        <path d="M34,4 L33,15 L35,26 L34,31"/>
        <path d="M0,28 L44,4" stroke-width="3.4"/>
      </g>
    </svg>
    <div class="lbl"><b>BOSS READY</b></div>
  </div>

  <!-- wall: head-to-head chalk ledger -->
  <div class="ledger">
    <div class="row"><span class="who">YOU</span>
      <svg width="30" height="13" viewBox="0 0 30 13" shape-rendering="crispEdges"><path d="M3,1 L2.4,6 L3.5,11" fill="none" stroke="#f2ede1" stroke-width="2" stroke-linecap="round"/></svg>
    </div>
    <div class="row"><span class="who">GROG</span>
      <svg width="40" height="13" viewBox="0 0 40 13" shape-rendering="crispEdges">
        <g fill="none" stroke="#9c8c74" stroke-width="2" stroke-linecap="round">
          <path d="M3,1 L2.4,6 L3.5,11"/><path d="M11,1 L10.4,6 L11.5,11"/><path d="M19,1 L18.4,6 L19.5,11"/>
        </g>
      </svg>
    </div>
  </div>

  <!-- the innkeep's book -->
  <div class="book" id="book">
    <div class="nail"></div><div class="strings"></div>
    <div class="frame"><div class="slate">
      <div class="bk-title">THE INNKEEP'S BOOK</div>
      <div class="bk-odds-l">ODDS ON YOU</div>
      <div class="bk-odds">2 : 1</div>
      <div class="bk-stake">STAKE <b>30g</b></div>
      <div class="bk-hint">tap to place yer coin</div>
      <div class="stamp">BET PLACED</div>
    </div></div>
  </div>

  <!-- Grog, overlapping the table edge -->
  <div class="grog">
    <img src="../Characters_ART/Drunkard.png" alt="Grog">
    <div class="name">GROG</div>
  </div>

  <!-- the table (objects injected by JS) -->
  <div id="table">
    <span class="scrawl" style="left:4%;top:74%">your bones · his gear taps to peek</span>
    <!-- the tell, spoken across the table (game tbt caption style) -->
    <div class="tell">
      <div class="t-name">GROG'S TELL · <span class="rule">LAST CALL</span></div>
      <div class="t-quote">"Bank under 500 at my table — it won't count."</div>
    </div>
    <!-- pouch -->
    <div class="pouch" style="right:1%;top:78%">
      <img src="../Menu_Art/pouch.png" alt="Pouch"><span class="badge">2</span>
    </div>
  </div>

  <!-- dust -->
  <span class="mote" style="left:30%;top:48%"></span>
  <span class="mote" style="left:64%;top:42%;animation-delay:4s"></span>
  <span class="mote" style="left:48%;top:56%;animation-delay:8s"></span>

  <!-- action dock -->
  <div id="dock">
    <div class="boss-wrap">
      <div class="challenge" id="challenge">
        <span class="lbl">CHALLENGE BOSS</span>
        <span class="sub" id="chPts">+1800</span>
      </div>
    </div>
    <div class="bottom-nav">
      <div class="nav-btn"><img class="nav-icon" src="../Menu_Art/beer.png" alt="Menu"><span class="nav-label">MENU</span></div>
      <div class="nav-btn"><img class="nav-icon" src="../Menu_Art/Shop.png" alt="Shop"><span class="nav-label">SHOP</span></div>
    </div>
  </div>

  <!-- inspect popover -->
  <div id="pop" class="rarity-tin"><div class="p-title"></div><div class="p-body"></div></div>
</div>

<script>
/* ── real pip geometry (index.html:9837-9838) ── */
var DP7={TL:8,TR:12,ML:22,MM:24,MR:26,BL:36,BR:40};
var FACE_DOTS={1:[24],2:[8,40],3:[8,24,40],4:[8,12,36,40],5:[8,12,24,36,40],6:[8,12,22,26,36,40]};
function dieCells(val){
  var dots=FACE_DOTS[val]||FACE_DOTS[1],h='';
  for(var i=0;i<49;i++)h+='<div class="dc'+(dots.indexOf(i)>=0?' dot':'')+'"></div>';
  return h;
}
/* ── real corner ornaments (index.html:10533) ── */
function gcCorners(){
  function c(pos){return '<svg class="gc '+pos+'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22">'+
    '<rect x="0" y="0" width="3" height="16" rx="1" fill="currentColor"/>'+
    '<rect x="0" y="0" width="16" height="3" rx="1" fill="currentColor"/>'+
    '<rect x="14" y="-1" width="3" height="5" rx="1" fill="currentColor"/>'+
    '<rect x="-1" y="14" width="5" height="3" rx="1" fill="currentColor"/>'+
    '<polygon points="5,1 9,5 5,9 1,5" fill="currentColor"/></svg>';}
  return ['tl','tr','bl','br'].map(c).join('');
}
var TABLE=document.getElementById('table');
function place(el,pos){el.style.left=pos.left||'';el.style.right=pos.right||'';el.style.top=pos.top;
  el.style.transform='rotate('+(pos.rot||0)+'deg)';TABLE.appendChild(el);}

/* his cards (boss-grog rarity, emoji over CARD_BG swatch) */
var CARDS=[
  {rar:'boss-grog',icon:'🍺',bg:'#6e4a28',rot:-6,left:'1%',top:'27%',
   info:["GROG'S FLASK","Once a match, Grog swigs and re-rolls his whole hand."]},
  {rar:'boss-grog',icon:'🎲',bg:'#3a2818',rot:6,left:'83%',top:'27%',
   info:["ONE MORE ROUND","Grog survives his first bust and keeps rolling."]}
];
CARDS.forEach(function(c){
  var o=document.createElement('div');o.className='obj card-obj';o.dataset.info=c.info[0]+'|'+c.info[1];o.dataset.rar=c.rar;
  o.innerHTML='<div class="lo-mini-card rarity-'+c.rar+'"><div class="card-outer">'+
    '<div class="gcard rarity-'+c.rar+'"><div class="gcard-cover" style="background:'+c.bg+'">'+c.icon+'</div>'+
    '<div class="gcard-frame"></div>'+gcCorners()+'</div></div></div>';
  place(o,c);
});

/* his dice — 3 iron, 3 bone (smaller, far side) */
var HIS=[
  {mat:'iron',val:2,left:'24%',top:'28%',rot:9},
  {mat:'iron',val:3,left:'40%',top:'28%',rot:-12},
  {mat:'iron',val:4,left:'56%',top:'28%',rot:3},
  {mat:'bone',val:1,left:'32%',top:'44%',rot:14},
  {mat:'bone',val:2,left:'48%',top:'44%',rot:-6},
  {mat:'bone',val:5,left:'64%',top:'44%',rot:2}
];
HIS.forEach(function(d){
  var o=document.createElement('div');o.className='obj die d34 dtype-'+d.mat;
  o.dataset.info=(d.mat==='iron'?'IRON DIE|Leans steady — fewer wild swings, fewer busts.':'BONE DIE|The honest classic. No tricks in it.');
  o.dataset.rar=(d.mat==='iron'?'silver':'tin');
  o.innerHTML=dieCells(d.val);
  place(o,d);
});

/* your dice — 6 bone (larger, near edge) */
var YOU=[
  {val:4,left:'1%',top:'82%',rot:-6},{val:1,left:'14%',top:'87%',rot:5},
  {val:3,left:'28%',top:'82%',rot:-3},{val:6,left:'42%',top:'87%',rot:10},
  {val:2,left:'55%',top:'82%',rot:-12},{val:5,left:'68%',top:'87%',rot:6}
];
YOU.forEach(function(d){
  var o=document.createElement('div');o.className='obj die d48 dtype-bone';
  o.innerHTML=dieCells(d.val);
  place(o,d);
});

/* ── interactions ── */
var gold=470,placed=false;
document.getElementById('book').addEventListener('pointerdown',function(){
  placed=!placed;gold+=placed?-30:30;
  document.getElementById('gold').textContent=gold;
  document.getElementById('book').classList.toggle('placed',placed);
  var sub=document.getElementById('chPts');
  if(placed){sub.textContent='30g RIDES AT 2:1';sub.classList.add('bet');}
  else{sub.textContent='+1800';sub.classList.remove('bet');}
});
var pop=document.getElementById('pop'),stage=document.getElementById('stage');
function showPop(o,ev){
  if(ev)ev.stopPropagation();
  var p=o.dataset.info.split('|');
  pop.className='rarity-'+(o.dataset.rar||'tin');
  pop.querySelector('.p-title').textContent=p[0];
  pop.querySelector('.p-body').textContent=p[1];
  var r=o.getBoundingClientRect(),s=stage.getBoundingClientRect();
  var x=Math.max(8,Math.min(s.width-198,r.left-s.left-70));
  var y=r.top-s.top+r.height+10;
  if(y>s.height-150)y=r.top-s.top-100;
  pop.style.left=x+'px';pop.style.top=y+'px';
  pop.classList.add('show');
}
document.querySelectorAll('.obj[data-info]').forEach(function(o){
  o.addEventListener('pointerdown',function(ev){showPop(o,ev);});
});
document.addEventListener('pointerdown',function(e){
  if(!e.target.closest('.obj'))pop.classList.remove('show');
});
document.getElementById('challenge').addEventListener('pointerdown',function(){
  this.animate([{transform:'scale(1)'},{transform:'scale(1.03)'},{transform:'scale(1)'}],{duration:260,easing:'ease-out'});
});
</script>
</body>
</html>
