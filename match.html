<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fark! – Match</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0c0a06">
<link rel="apple-touch-icon" href="Menu_Art/Menu.png">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&family=Jacquard+24&family=MedievalSharp&family=Press+Start+2P&family=Uncial+Antiqua&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Alagard';src:url('Fonts/Pixel/alagard.ttf') format('truetype')}
@font-face{font-family:'Enchanted Land';src:url('Fonts/Medieval/Enchanted Land.otf') format('opentype')}
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0c0e16;
  --bg2:#12141c;
  --gold:#c8a050;
  --golddim:#5a4428;
  --red:#a05050;
  --reddim:#4a2828;
  --green:#6a9a70;
  --greendim:#3a5a40;
  --text:#b8b0a0;
  --textdim:#68605a;
  --font-px:'Alagard','Press Start 2P',monospace;
  --font-rp:'Uncial Antiqua',serif;
}
html{background:var(--bg)}
body::before{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:url('Environment_ART/match.png');
  background-size:100% 100%;
  background-position:center top;
  background-repeat:no-repeat;
  image-rendering:pixelated;
  -ms-interpolation-mode:nearest-neighbor;
}
body::after{
  content:'';position:fixed;inset:0;z-index:-1;
  background:
    repeating-conic-gradient(rgba(42,28,18,0.12) 0% 25%, transparent 0% 50%) 0 0/4px 4px,
    rgba(42,28,18,0.65);
  pointer-events:none;
  image-rendering:pixelated;
}
body{
  background:transparent;color:var(--text);
  font-family:var(--font-px);
  overflow:hidden;position:fixed;inset:0;
  display:flex;flex-direction:column;
  image-rendering:pixelated;
  -webkit-font-smoothing:none;
}

/* ─── TOP BAR ─── */
.top-bar{
  position:relative;z-index:20;
  display:flex;align-items:center;justify-content:center;
  padding:0 16px;flex-shrink:0;
  background:rgba(30,18,10,1);
  overflow:visible;height:48px;
}
.top-bar::after{
  content:'';position:absolute;left:0;right:0;top:100%;height:18px;
  pointer-events:none;z-index:2;
  background:repeating-conic-gradient(rgba(30,18,10,1) 0% 25%, transparent 0% 50%) 0 0/4px 4px;
  -webkit-mask-image:linear-gradient(to bottom, black 0%, rgba(0,0,0,.85) 15%, rgba(0,0,0,.6) 30%, rgba(0,0,0,.3) 50%, transparent 70%);
  mask-image:linear-gradient(to bottom, black 0%, rgba(0,0,0,.85) 15%, rgba(0,0,0,.6) 30%, rgba(0,0,0,.3) 50%, transparent 70%);
  image-rendering:pixelated;
}
.top-bar .title{
  position:relative;display:flex;align-items:baseline;
  font-family:'Uncial Antiqua',serif;font-size:clamp(28px,8vw,40px);
  letter-spacing:3px;z-index:3;
  margin-top:8px;padding-top:4px;
}
.top-bar .title .letter{
  display:inline-block;color:#f0b830;
  text-shadow:1px 0 0 #d49020,-1px 0 0 #c48018,0 1px 0 #b07018,0 -1px 0 #ffe060,
    1px 1px 0 #a06010,2px 2px 0 #6a3a08,3px 3px 0 #2a1804;
  -webkit-text-stroke:1px #a06818;
  background:linear-gradient(180deg,#fff0b0 0%,#ffd040 25%,#e8a020 50%,#ffd040 75%,#fff0b0 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:url(#pixelWobble) brightness(1);
  animation:letterBounce 2.5s ease-in-out infinite;
}
.top-bar .title .letter:nth-child(1){animation-delay:0s}
.top-bar .title .letter:nth-child(2){animation-delay:0.12s}
.top-bar .title .letter:nth-child(3){animation-delay:0.24s}
.top-bar .title .letter:nth-child(4){animation-delay:0.36s}
.top-bar .title .letter:nth-child(5){animation-delay:0.48s}
@keyframes letterBounce{
  0%,40%,100%{transform:translateY(0);filter:url(#pixelWobble) brightness(1)}
  8%{transform:translateY(-6px);filter:url(#pixelWobble) brightness(1.5) saturate(1.3)}
  20%{transform:translateY(1px);filter:url(#pixelWobble) brightness(1.15)}
  30%{transform:translateY(0);filter:url(#pixelWobble) brightness(1)}
}
.gold-pill{
  position:absolute;right:16px;top:50%;transform:translateY(-50%);
  display:flex;align-items:center;gap:5px;padding:5px 10px;
  border:2px solid var(--golddim);font-size:11px;color:var(--gold);
  background:rgba(20,16,8,.85);opacity:1;z-index:5;
}

/* ─── HUD BAR ─── */
.hud{
  display:flex;align-items:center;padding:6px 10px;gap:0;
  background:rgb(30,18,10);
  border-bottom:1px solid rgba(200,160,80,.15);
  flex-shrink:0;position:relative;z-index:15;
}
.hud::after{
  content:'';position:absolute;left:0;right:0;top:100%;height:18px;
  pointer-events:none;z-index:2;
  background:repeating-conic-gradient(rgba(30,18,10,.95) 0% 25%, transparent 0% 50%) 0 0/4px 4px;
  -webkit-mask-image:linear-gradient(to bottom, black 0%, rgba(0,0,0,.85) 15%, rgba(0,0,0,.6) 30%, rgba(0,0,0,.3) 50%, transparent 70%);
  mask-image:linear-gradient(to bottom, black 0%, rgba(0,0,0,.85) 15%, rgba(0,0,0,.6) 30%, rgba(0,0,0,.3) 50%, transparent 70%);
  image-rendering:pixelated;
}
.hud-block{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1}
.hud-lbl{font-family:'Enchanted Land',serif;font-size:16px;color:var(--textdim);letter-spacing:1.5px}
#oppName{position:relative}
#skillIcon{position:absolute;right:100%;margin-right:2px;top:50%;transform:translateY(-50%)}
.hud-score{font-family:var(--font-px);font-size:clamp(17px,5vw,24px);line-height:1}
.hud-score.p{color:var(--gold);text-shadow:0 0 8px rgba(200,160,80,.35)}
.hud-score.o{color:var(--red);text-shadow:0 0 8px rgba(160,80,80,.3)}
.prog{width:min(80px,20vw);height:5px;background:rgba(10,6,2,.6);border:1px solid rgba(200,160,80,.2);margin-top:2px;border-radius:3px;overflow:hidden}
.prog-fill{height:100%;transition:width .4s;border-radius:3px}
.prog-fill.p{background:linear-gradient(90deg,var(--golddim),var(--gold))}
.prog-fill.o{background:linear-gradient(90deg,var(--reddim),var(--red))}
.hud-mid{display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 0 auto;padding:0 6px;min-width:110px}
.hud-tgt-lbl{font-family:var(--font-px);font-size:12px;color:var(--textdim);letter-spacing:2px}
.hud-target{font-family:var(--font-px);font-size:clamp(24px,7.5vw,36px);color:var(--gold);letter-spacing:1px;white-space:nowrap;text-shadow:2px 2px 0 rgba(0,0,0,.6)}
.hud-turn-pts{font-size:clamp(13px,3.5vw,17px);color:var(--green);height:0;overflow:visible;text-shadow:0 0 8px rgba(106,154,112,.4);pointer-events:none}
.hud-turnnum{font-family:var(--font-px);font-size:12px;color:var(--textdim)}

/* ─── EDICT BAR ─── */
.edict-bar{
  display:none;font-family:'Enchanted Land',serif;font-size:16px;letter-spacing:1px;
  color:var(--red);background:rgba(40,16,16,.9);
  border-bottom:1px solid rgba(160,80,80,.2);
  padding:5px 10px;text-align:center;flex-shrink:0;
  letter-spacing:1px;
}
.edict-bar.show{display:block}

/* ─── CARD BARS ─── */
.card-bar{
  display:flex;justify-content:center;
  flex-shrink:0;position:relative;z-index:5;overflow:visible;
  background:none;border:none;padding:0;
  height:0;/* takes no flex space – cards overflow visually */
}
.bar-lbl{display:none}

/* ─── MATCH CARDS (fanned hand) ─── */
.mcard{
  width:70px;height:98px;border-radius:5px;overflow:visible;
  position:absolute;cursor:pointer;
  border:none;background:transparent;
  image-rendering:pixelated;
  transition:transform .3s ease, filter .3s ease;
  transform-origin:center center;
}
/* gcard overrides for compact match-card size */
.mcard .gcard{width:100%;height:100%;border-width:2px;border-radius:5px;filter:url(#pixelWobbleLite)}
.mcard .gcard-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;image-rendering:pixelated;pointer-events:none}
.mcard .gcard-frame{position:absolute;top:4px;left:4px;right:4px;bottom:4px;border-radius:2px;pointer-events:none;z-index:1;border:1px solid var(--ctrim2);opacity:.7}
.mcard .gc{width:10px;height:10px}
.mcard .gc.tl{top:4px;left:4px}
.mcard .gc.tr{top:4px;right:4px}
.mcard .gc.bl{bottom:4px;left:4px}
.mcard .gc.br{bottom:4px;right:4px}
.mcard .gcard-band{display:none}

/* Bottom fan: player cards tuck behind controls bar */
.card-bar.bot .mcard{
  top:0;left:var(--cx,50%);margin-left:-35px;
  transform:translateY(calc(-50% - var(--lift,0px))) rotate(var(--rot,0deg));
}
.card-bar.bot .mcard.peeked{
  transform:translateY(-190%) rotate(0deg) scale(2);z-index:40;
  filter:drop-shadow(0 -4px 16px rgba(0,0,0,.6));
}

/* Top fan: NPC cards tuck behind HUD bar, content flipped 180° */
.card-bar.top .mcard{
  top:0;left:var(--cx,50%);margin-left:-35px;
  transform:translateY(calc(-50% + var(--lift,0px))) rotate(var(--rot,0deg));
}
.card-bar.top .gcard{transform:rotate(180deg)}
.card-bar.top .mcard.peeked{
  transform:translateY(65%) rotate(0deg) scale(2);z-index:40;
  filter:drop-shadow(0 4px 16px rgba(0,0,0,.6));
}

/* ─── CARD PEEK TOOLTIP ─── */
.mcard-tooltip{
  position:absolute;pointer-events:none;opacity:0;
  transition:opacity .25s ease .05s;z-index:50;
  width:140px;
  padding:0;overflow:hidden;
  background:linear-gradient(165deg,var(--cface2) 0%,var(--cface) 55%,var(--cface2) 100%);
  border:3px solid var(--ctrim2);border-radius:6px;
  box-shadow:inset 0 0 0 1px var(--ctrim),inset 0 0 0 5px var(--cface),inset 0 0 0 6px var(--ctrim2),0 5px 20px rgba(0,0,0,.85);
  font-family:var(--font-px);
  color:var(--ctxt);text-align:center;image-rendering:auto;
  left:50%;isolation:isolate;
}
.mcard-tooltip .gc{position:absolute;z-index:4;pointer-events:none;width:14px;height:14px;color:var(--ctrim2);overflow:visible;filter:drop-shadow(0 0 3px var(--ctrim2)) brightness(1.3)}
.mcard-tooltip .gc.tl{top:3px;left:3px}
.mcard-tooltip .gc.tr{top:3px;right:3px;transform:scaleX(-1)}
.mcard-tooltip .gc.bl{bottom:3px;left:3px;transform:scaleY(-1)}
.mcard-tooltip .gc.br{bottom:3px;right:3px;transform:scale(-1,-1)}
.mcard-tooltip .tip-name{
  font-size:7px;color:var(--ctxt);letter-spacing:1px;line-height:1.5;
  padding:12px 14px 5px;z-index:3;position:relative;word-break:break-word;
}
.mcard-tooltip .tip-eff{
  font-size:6px;color:var(--ctrim2);letter-spacing:.3px;line-height:1.8;
  padding:3px 12px 10px;z-index:3;position:relative;word-break:break-word;
}
.mcard-tooltip .tip-band{
  position:relative;z-index:3;text-align:center;
  padding:5px 2px;background:var(--ctrim);
  font-size:6px;color:var(--ctrim2);letter-spacing:2px;
  border-top:1px solid var(--ctrim2);opacity:.95;
}
.mcard.peeked .mcard-tooltip{opacity:1;pointer-events:auto}
/* Player tooltip: above the card */
.card-bar.bot .mcard-tooltip{
  bottom:calc(100% + 6px);
  transform:translateX(-50%) scale(0.5);transform-origin:center bottom;
}
/* NPC tooltip: below the card */
.card-bar.top .mcard-tooltip{
  top:calc(100% + 6px);
  transform:translateX(-50%) scale(0.5);transform-origin:center top;
}

/* ─── CARD CHIP SYSTEM ─── */
.rarity-tin{--ctrim:#3d352c;--ctrim2:#8a7a68;--cface:#18140f;--cface2:#221e18;--ctxt:#c0b498;--cglow:rgba(138,122,104,.35)}
.rarity-silver{--ctrim:#3a404a;--ctrim2:#9098a8;--cface:#0e1018;--cface2:#161a22;--ctxt:#c4c8d4;--cglow:rgba(144,152,168,.3)}
.rarity-gold{--ctrim:#5a3c00;--ctrim2:#e0b428;--cface:#160e00;--cface2:#241800;--ctxt:#ffe878;--cglow:rgba(224,180,40,.55)}

/* ─── DICE TYPE COLORS (matches store page) ─── */
.dtype-bone   {--dborder:#a89882;--dborder2:#c8b898;--dface:#d8ccb4;--dface2:#efe4d0;--dface3:#c0b49a;--dhigh:#f5ece0;--dpip:#5a4a38;--dpip2:#3a2e20;--dglow:rgba(168,152,130,.3);--ddither:rgba(180,160,130,.18)}
.dtype-iron   {--dborder:#6a6e74;--dborder2:#8a8e94;--dface:#4a4e56;--dface2:#62666e;--dface3:#36393f;--dhigh:#7a7e86;--dpip:#c8ccd2;--dpip2:#a0a4aa;--dglow:rgba(106,110,116,.35);--ddither:rgba(140,150,170,.15)}
.dtype-flint  {--dborder:#5a524a;--dborder2:#7a726a;--dface:#3c3630;--dface2:#524a42;--dface3:#2a2420;--dhigh:#6a6258;--dpip:#c8b898;--dpip2:#a09078;--dglow:rgba(90,82,74,.3);--ddither:rgba(120,100,80,.15)}
.dtype-lead   {--dborder:#505460;--dborder2:#707480;--dface:#2e3038;--dface2:#42454e;--dface3:#1e2028;--dhigh:#5a5e6a;--dpip:#8890a0;--dpip2:#687080;--dglow:rgba(80,84,96,.35);--ddither:rgba(100,110,140,.15)}
.dtype-amber  {--dborder:#c89030;--dborder2:#e8b040;--dface:#7a5200;--dface2:#a07010;--dface3:#503800;--dhigh:#c89830;--dpip:#ffe480;--dpip2:#e0c060;--dglow:rgba(200,144,48,.4);--ddither:rgba(200,160,60,.18)}
.dtype-jade   {--dborder:#3a9a5a;--dborder2:#50c070;--dface:#14442a;--dface2:#1e5a38;--dface3:#082a16;--dhigh:#30804c;--dpip:#70e890;--dpip2:#50c070;--dglow:rgba(58,154,90,.35);--ddither:rgba(60,160,90,.18)}
.dtype-brass  {--dborder:#b08838;--dborder2:#d0a848;--dface:#5a4020;--dface2:#6e5428;--dface3:#382610;--dhigh:#8a6c30;--dpip:#e8c878;--dpip2:#c8a858;--dglow:rgba(176,136,56,.35);--ddither:rgba(180,140,60,.15)}
.dtype-silver {--dborder:#a8b0c0;--dborder2:#c8d0e0;--dface:#444850;--dface2:#585e68;--dface3:#2c3038;--dhigh:#7a8090;--dpip:#dce0e8;--dpip2:#b8bcc4;--dglow:rgba(168,176,192,.35);--ddither:rgba(170,180,200,.15)}
.dtype-crystal{--dborder:#80b8e8;--dborder2:#a0d0ff;--dface:rgba(40,70,110,.8);--dface2:rgba(60,100,150,.8);--dface3:rgba(20,40,80,.8);--dhigh:rgba(120,180,240,.5);--dpip:#c0e0ff;--dpip2:#90c0e8;--dglow:rgba(128,184,232,.4);--ddither:rgba(100,180,255,.2)}

.cchip{flex-shrink:0;cursor:pointer;width:36px;height:36px;perspective:700px;position:relative;z-index:40;transition:width .2s ease,height .2s ease,transform .2s ease}
.cchip.open{width:92px;height:136px;transform:translateY(-106px);z-index:60}
.cchip-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .38s ease}
.cchip.open .cchip-inner{transform:rotateY(180deg)}
.cchip-front{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:5px;overflow:hidden;border:2px solid var(--ctrim);background:linear-gradient(165deg,var(--cface2) 0%,var(--cface) 100%);box-shadow:inset 0 0 0 1px var(--ctrim2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;isolation:isolate}
.cchip-front::before{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(118deg,transparent 25%,rgba(255,255,255,.1) 50%,transparent 75%);animation:gcSheen 4s ease-in-out infinite}
.chip-icon{font-size:18px;line-height:1;z-index:1}
.chip-gem{width:5px;height:5px;border-radius:50%;z-index:1;background:var(--ctrim2);box-shadow:0 0 4px var(--ctrim2)}
.cchip-back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:rotateY(180deg);border-radius:5px;overflow:hidden;background:var(--cface,#0e0e1a);isolation:isolate}
.cchip-back .gc{width:14px;height:14px}
.cchip-back .gc.tl{top:2px;left:2px}
.cchip-back .gc.tr{top:2px;right:2px}
.cchip-back .gc.bl{bottom:2px;left:2px}
.cchip-back .gc.br{bottom:2px;right:2px}
.cchip-back .gcard{position:absolute;inset:0;padding:0 5px;gap:1px}
.cchip-back .gcard-pip{margin-top:10px;width:6px;height:6px}
.cchip-back .gcard-icon{font-size:20px}
.cchip-back .gcard-name{font-size:6px}
.cchip-back .gcard-eff{font-size:5px;line-height:1.6}
.cchip-back .gcard-band{font-size:5px;padding:2px}
.cchip-back .gcard-rule{margin:2px 0}
.card-bar.top .cchip.open{transform:translateY(0)}

.gcard{
  position:relative;border-radius:6px;overflow:hidden;
  background:linear-gradient(165deg,var(--cface2) 0%,var(--cface) 55%,var(--cface2) 100%);
  border:3px solid var(--ctrim2);
  box-shadow:inset 0 0 0 1px var(--ctrim),inset 0 0 0 5px var(--cface),inset 0 0 0 6px var(--ctrim2),0 5px 20px rgba(0,0,0,.85);
  display:flex;flex-direction:column;align-items:center;
  font-family:var(--font-px);
  transition:box-shadow .15s,transform .1s;
  isolation:isolate;width:100%;height:100%;
  filter:url(#pixelWobbleLite);
}
.gcard::before{
  content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(118deg,transparent 38%,rgba(255,255,255,.06) 49%,rgba(255,255,255,.06) 51%,transparent 62%);
  animation:gcSheen 6s ease-in-out infinite;
}
@keyframes gcSheen{0%,100%{transform:translateX(-160%);opacity:0}12%{opacity:1}55%{transform:translateX(160%);opacity:0}}
.gcard-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;image-rendering:pixelated;pointer-events:none}
.gcard-frame{position:absolute;top:8px;left:8px;right:8px;bottom:26px;border-radius:3px;pointer-events:none;z-index:1;border:1px solid var(--ctrim2);opacity:.7}
.gc{position:absolute;z-index:4;pointer-events:none;user-select:none;width:22px;height:22px;color:var(--ctrim2);overflow:visible;filter:drop-shadow(0 0 4px var(--ctrim2)) brightness(1.3)}
.gc.tl{top:8px;left:8px}
.gc.tr{top:8px;right:8px;transform:scaleX(-1)}
.gc.bl{bottom:26px;left:8px;transform:scaleY(-1)}
.gc.br{bottom:26px;right:8px;transform:scale(-1,-1)}
.gcard-pip{width:8px;height:8px;border-radius:50%;z-index:3;flex-shrink:0;margin-top:16px;margin-bottom:4px;background:var(--ctrim2);box-shadow:0 0 7px var(--ctrim2)}
.gcard-icon{font-size:28px;line-height:1;z-index:3;flex-shrink:0}
.gcard-rule{width:62%;height:1px;background:var(--ctrim2);opacity:.5;flex-shrink:0;z-index:3;margin:5px 0}
.gcard-name{font-size:7px;color:var(--ctxt);text-align:center;letter-spacing:1px;line-height:1.5;z-index:3;padding:0 10px;word-break:break-word;flex-shrink:0}
.gcard-eff{font-size:6px;color:var(--ctrim2);text-align:center;letter-spacing:.3px;line-height:1.7;z-index:3;padding:0 8px;word-break:break-word;flex:1}
.gcard-band{position:absolute;bottom:0;left:0;right:0;text-align:center;padding:5px 2px;z-index:3;background:var(--ctrim);font-size:7px;color:var(--ctrim2);letter-spacing:2px;border-top:1px solid var(--ctrim2);opacity:.95}

/* ─── CARD BACK (for zoom flip) ─── */
.gcard-back{
  position:absolute;inset:0;border-radius:6px;overflow:hidden;
  background:linear-gradient(165deg,var(--cface2) 0%,var(--cface) 55%,var(--cface2) 100%);
  border:3px solid var(--ctrim2);
  box-shadow:0 5px 20px rgba(0,0,0,.85);
  display:flex;flex-direction:column;align-items:center;
  padding:16px 12px 10px;gap:6px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  transform:rotateY(180deg);isolation:isolate;
  filter:url(#pixelWobbleLite);
}
.gcard-back-name{font-size:22px;color:#c8845a;text-align:center;letter-spacing:0.5px;z-index:2;flex-shrink:0;font-family:'Jacquard 24',serif;margin-top:auto;margin-bottom:8px;text-shadow:0 1px 0 rgba(0,0,0,.6);line-height:1.3;padding:0 6px;word-break:break-word}
.gcard-back-desc{font-size:9px;color:#b0a890;text-align:center;line-height:2.4;z-index:2;padding:0 8px;width:100%;overflow-y:auto;flex:1;min-height:0}
.gcard-back-frame{display:none}
.gcard-tap{font-size:6px;color:var(--ctrim2);opacity:.6;letter-spacing:1px;z-index:3;flex-shrink:0;margin-top:auto}

/* ─── CARD ZOOM OVERLAY ─── */
.card-zoom-overlay{
  position:fixed;inset:0;z-index:9700;
  background:rgba(0,0,0,0);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;pointer-events:none;transition:background .35s ease;
}
.card-zoom-overlay.open{background:rgba(0,0,0,.85);pointer-events:auto}
.card-zoom-card{
  width:220px;height:330px;perspective:900px;
  transform:scale(0);transition:transform .45s cubic-bezier(.2,1.2,.3,1);
}
.card-zoom-overlay.open .card-zoom-card{
  transform:scale(1);animation:czFloat 3.5s ease-in-out infinite;
}
@keyframes czFloat{0%,100%{transform:scale(1) translateY(0)}50%{transform:scale(1) translateY(-6px)}}
.cz-wrap{width:100%;height:100%;position:relative;transform-style:preserve-3d}
.cz-wrap .gcard{backface-visibility:hidden;-webkit-backface-visibility:hidden;position:absolute;inset:0}
.cz-wrap .gcard-back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.cz-wrap .gcard-pip{margin-top:22px}
.cz-wrap .gcard-icon{font-size:38px}
.cz-wrap .gcard-name{font-size:9px;padding:0 14px}
.cz-wrap .gcard-eff{font-size:7px;padding:0 12px;line-height:1.9}
.cz-wrap .gcard-art{bottom:26px;height:auto}
.cz-wrap .gcard-band{font-size:6px;padding:5px 2px;opacity:1}
.cz-wrap .gc{width:18px;height:18px}
.cz-wrap .gcard-back-name{font-size:28px;letter-spacing:0.5px;color:#c8845a;padding:0 10px}
.cz-wrap .gcard-back-desc{font-size:10px;line-height:2.2;padding:0 14px}
/* ─── DICE ZOOM OVERLAY ─── */
.dice-zoom-overlay{
  position:fixed;inset:0;z-index:9700;
  background:rgba(0,0,0,.92);
  display:flex;align-items:center;flex-direction:column;
  justify-content:center;gap:0;
  padding:20px;
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.dice-zoom-overlay.open{opacity:1;pointer-events:auto}
.dice-3d-wrap{
  width:200px;height:200px;perspective:500px;
  margin-bottom:20px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  cursor:grab;
  filter:url(#pixelWobbleLite) drop-shadow(0 6px 0 rgba(0,0,0,.6)) drop-shadow(0 2px 0 var(--dborder));
  transform:translateY(-30px);
}
.dice-3d-wrap:active{cursor:grabbing}
.dice-3d-cube{
  width:160px;height:160px;position:relative;
  transform-style:preserve-3d;transition:none;pointer-events:none;
}
.dice-face{
  position:absolute;width:160px;height:160px;
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  gap:4px;padding:16px;box-sizing:border-box;
  border:3px solid var(--dborder);border-radius:8px;
  background:var(--dface);image-rendering:pixelated;
  box-shadow:inset 2px 2px 0 var(--dhigh),inset -2px -2px 0 var(--dface3);
}
.dice-face::after{
  content:'';position:absolute;inset:0;pointer-events:none;border-radius:8px;
  background:repeating-conic-gradient(var(--ddither) 0% 25%, transparent 0% 50%) 0 0/4px 4px;
  image-rendering:pixelated;mix-blend-mode:overlay;
}
.dice-face.f-top{background:var(--dface2);border-color:var(--dborder2)}
.dice-face.f-right,.dice-face.f-left{background:var(--dface3);box-shadow:inset 2px 2px 0 var(--dface),inset -2px -2px 0 rgba(0,0,0,.3)}
.dice-face.f-bottom{background:var(--dface3);box-shadow:inset 2px 2px 0 var(--dface3),inset -2px -2px 0 rgba(0,0,0,.4)}
.dice-face.f-front {transform:translateZ(80px)}
.dice-face.f-back  {transform:rotateY(180deg) translateZ(80px)}
.dice-face.f-right {transform:rotateY(90deg) translateZ(80px)}
.dice-face.f-left  {transform:rotateY(-90deg) translateZ(80px)}
.dice-face.f-top   {transform:rotateX(90deg) translateZ(80px)}
.dice-face.f-bottom{transform:rotateX(-90deg) translateZ(80px)}
.pip{background:var(--dpip);align-self:center;justify-self:center;image-rendering:pixelated;border-radius:2px}
.pip.on{width:50%;height:50%;box-shadow:1px 1px 0 var(--dpip2),inset 0 -1px 0 rgba(0,0,0,.2)}
.pip.off{width:0;height:0}
.dice-zoom-info{
  position:relative;text-align:center;width:280px;
  padding:20px 18px 16px;margin-bottom:16px;
  transform:translateY(40px);transition:transform .3s;opacity:0;
}
.dice-zoom-overlay.open .dice-zoom-info{transform:translateY(30px);opacity:1}
.dice-zoom-info canvas.dz-panel-bg{position:absolute;inset:0;image-rendering:pixelated;z-index:0}
.dice-zoom-info>*:not(canvas){position:relative;z-index:1}
.dz-name{font-size:28px;letter-spacing:0.5px;margin-bottom:8px;color:var(--dborder2);font-family:'Jacquard 24',serif;text-shadow:0 1px 0 rgba(0,0,0,.6)}
.dz-desc{font-size:9px;color:var(--text);line-height:2;margin-bottom:8px;letter-spacing:.3px}
.dz-bias{font-size:7px;color:var(--textdim);letter-spacing:1px;margin-bottom:0}

/* ─── DICE AREA ─── */
.dice-area{
  flex:1;min-height:0;display:flex;flex-direction:column;
  align-items:center;padding:62px 6px 54px;
  position:relative;overflow:hidden;
}
.opp-dice-row{
  display:flex;flex-wrap:nowrap;gap:4px;
  justify-content:center;align-items:center;
  flex-shrink:0;height:clamp(56px,13vw,66px);padding:4px 0;
}
.opp-dice-row .die{width:clamp(44px,11vw,54px);height:clamp(44px,11vw,54px);cursor:default}
.opp-dice-row .die:active{transform:none}
.dice-sep{
  width:88%;max-width:360px;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  flex-shrink:0;margin:2px 0;opacity:0;
  transition:opacity .4s ease;
}
.dice-sep.show{opacity:.35}

/* ─── DIALOGUE BOX ─── */
.dlg-box{
  position:relative;z-index:90;display:flex;justify-content:center;
  pointer-events:none;opacity:0;transition:opacity .5s ease;
  flex-shrink:0;height:84px;overflow:visible;padding:4px 0;
}
.dlg-box.show{opacity:1}
.dlg-inner{display:flex;align-items:center;gap:8px;padding:2px 12px}
.dlg-portrait{
  width:70px;height:70px;border-radius:4px;image-rendering:auto;
  border:none;box-shadow:none;
  background:transparent;overflow:hidden;flex-shrink:0;
}
.dlg-portrait img{width:100%;height:100%;image-rendering:auto;display:block}
.dlg-scroll{
  position:relative;max-width:280px;padding:10px 28px;overflow:visible;
  display:flex;align-items:center;
}
.dlg-scroll canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.dlg-text{
  position:relative;z-index:1;
  font-family:'IM Fell English',serif;font-size:clamp(16px,4.6vw,21px);
  color:#4a3828;line-height:1.25;letter-spacing:0.3px;word-spacing:2px;
  text-align:center;text-wrap:balance;
}

/* ─── PLAYER DICE ROW ─── */
.player-dice-row{
  display:flex;flex-wrap:nowrap;gap:clamp(4px,1.8vw,8px);
  justify-content:center;align-items:center;
  flex:1;min-height:0;overflow:visible;
}

/* ─── DIE STYLES ─── */
.die{
  flex-shrink:0;cursor:pointer;position:relative;
  display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);
  width:clamp(48px,12vw,58px);height:clamp(48px,12vw,58px);
  background:var(--dface);
  border:3px solid var(--dborder);
  border-top-color:var(--dhigh);border-left-color:var(--dhigh);
  border-right-color:var(--dface3);border-bottom-color:var(--dface3);
  border-radius:3px;transition:transform .08s, box-shadow .25s ease;
  box-shadow:3px 4px 0 rgba(30,18,8,.45),4px 5px 0 rgba(30,18,8,.2);
}
.die::after{
  content:'';position:absolute;inset:0;pointer-events:none;border-radius:2px;
  background:repeating-conic-gradient(var(--ddither) 0% 25%, transparent 0% 50%) 0 0/4px 4px;
  image-rendering:pixelated;mix-blend-mode:overlay;
}
.die:active{transform:scale(.92)}
.die.sm{width:26px;height:26px;border-width:2px;border-radius:2px;cursor:default;box-shadow:2px 2px 0 rgba(0,0,0,.45)}
.die.sm:active{transform:none}
.die.selected{outline:none;box-shadow:0 0 8px rgba(200,160,80,.4)}
.die.selected::before{
  content:'';position:absolute;inset:-8px;pointer-events:none;z-index:2;
  border:3px solid var(--gold);background:transparent;
  clip-path:polygon(5px 0,calc(100% - 5px) 0,100% 5px,100% calc(100% - 5px),calc(100% - 5px) 100%,5px 100%,0 calc(100% - 5px),0 5px);
}
.die.combo-glow{animation:comboGlow .45s ease-out both;animation-delay:var(--gd,0s)}
@keyframes comboGlow{0%{filter:brightness(1);box-shadow:0 0 8px rgba(200,160,80,.4)}40%{filter:brightness(1.25);box-shadow:0 0 14px 3px rgba(255,200,80,.65)}100%{filter:brightness(1);box-shadow:0 0 8px rgba(200,160,80,.4)}}
.die.combo-glow::after{
  content:'';position:absolute;inset:0;border-radius:2px;z-index:3;pointer-events:none;
  background:linear-gradient(105deg,transparent 40%,rgba(255,240,200,.15) 48%,rgba(255,255,255,.2) 50%,rgba(255,240,200,.15) 52%,transparent 60%);
  background-size:300% 100%;
  animation:comboSheen .5s ease-out both;animation-delay:var(--gd,0s);
}
@keyframes comboSheen{0%{background-position:200% 0;opacity:0}12%{opacity:1}80%{opacity:1}100%{background-position:-100% 0;opacity:0}}
.die.committed{opacity:.38;cursor:default}
.die.committed:active{transform:none}
.die.rolling{animation:dRoll .4s linear infinite;cursor:default;box-shadow:none;transition:none}
@keyframes dRoll{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.die.bust{animation:dBust .38s steps(3)}
@keyframes dBust{0%,100%{transform:none}33%{transform:translate(-4px,3px)}66%{transform:translate(4px,-3px)}}
/* ─── CARD TRIGGER ANIMATIONS ─── */
.mcard.card-trigger .gcard{animation:cardTrigGlow .5s ease-out forwards}
@keyframes cardTrigGlow{
  0%{filter:brightness(1);box-shadow:none}
  30%{filter:brightness(1.5);box-shadow:0 0 12px 4px rgba(255,200,80,.7)}
  100%{filter:brightness(1);box-shadow:none}
}
.card-bar.bot .mcard.card-trigger{animation:cardTrigShakeBot .4s ease-out}
@keyframes cardTrigShakeBot{
  0%,100%{transform:translateY(calc(-50% - var(--lift,0px))) rotate(var(--rot,0deg))}
  33%{transform:translateY(calc(-50% - var(--lift,0px) - 3px)) rotate(calc(var(--rot,0deg) + 2deg))}
  66%{transform:translateY(calc(-50% - var(--lift,0px) + 3px)) rotate(calc(var(--rot,0deg) - 2deg))}
}
.card-bar.top .mcard.card-trigger{animation:cardTrigShakeTop .4s ease-out}
@keyframes cardTrigShakeTop{
  0%,100%{transform:translateY(calc(-50% + var(--lift,0px))) rotate(var(--rot,0deg))}
  33%{transform:translateY(calc(-50% + var(--lift,0px) - 3px)) rotate(calc(var(--rot,0deg) + 2deg))}
  66%{transform:translateY(calc(-50% + var(--lift,0px) + 3px)) rotate(calc(var(--rot,0deg) - 2deg))}
}
.card-trig-label{
  position:absolute;z-index:60;pointer-events:none;
  font-family:var(--font-px);font-size:13px;letter-spacing:.5px;
  color:var(--gold);text-shadow:1px 1px 0 #000,0 0 6px rgba(200,160,80,.5);
  white-space:nowrap;animation:cardTrigFloat 1.2s ease-out forwards;
}
.card-trig-label.opponent{color:var(--red);text-shadow:1px 1px 0 #000,0 0 6px rgba(160,80,80,.5)}
@keyframes cardTrigFloat{
  0%{opacity:1;transform:translateX(-50%) translateY(0)}
  60%{opacity:1;transform:translateX(-50%) translateY(-30px)}
  100%{opacity:0;transform:translateX(-50%) translateY(-45px)}
}
.card-bar.top .card-trig-label{animation:cardTrigFloatDown 1.2s ease-out forwards}
@keyframes cardTrigFloatDown{
  0%{opacity:1;transform:translateX(-50%) translateY(0)}
  60%{opacity:1;transform:translateX(-50%) translateY(30px)}
  100%{opacity:0;transform:translateX(-50%) translateY(45px)}
}

.dc{width:100%;height:100%}
.dc.dot{border-radius:50%;background:var(--dpip);width:70%;height:70%;margin:15%}

/* ─── KEPT TRAY ─── */
.kept-tray{
  display:none;align-items:center;gap:6px;
  min-height:32px;padding:4px 10px;flex-wrap:wrap;
  justify-content:center;flex-shrink:0;
  position:absolute;left:0;right:0;bottom:24px;
  pointer-events:none;z-index:5;
}
.kept-tray.has-items{display:flex}
.kept-pts{font-family:var(--font-px);font-size:13px;color:var(--green);align-self:center;margin-right:2px}

/* ─── STATUS STRIPS ─── */
.status-strip{
  display:flex;align-items:center;justify-content:center;
  height:22px;overflow:hidden;flex-shrink:0;padding:2px 8px;width:100%;
}
.status-msg{
  font-family:var(--font-px);
  font-size:clamp(13px,3.8vw,18px);text-align:center;letter-spacing:1px;
  white-space:nowrap;color:var(--textdim);opacity:.45;
}
.status-msg.gold{color:var(--gold);opacity:1;font-size:clamp(18px,5vw,24px)}
.status-msg.red{color:var(--red);opacity:1;font-size:clamp(16px,4.4vw,22px)}
.status-msg.green{color:var(--green);opacity:1;font-size:clamp(16px,4.4vw,22px)}
.status-msg.active{color:var(--text);opacity:.65}

/* ─── CONTROL BUTTONS ─── */
.controls{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px;flex-shrink:0;
  background:rgb(30,18,10);
  border-top:1px solid rgba(200,160,80,.15);
  position:relative;z-index:15;
}
.ctrl-btn{
  position:relative;border:none;cursor:pointer;
  background:transparent;padding:0;
  height:clamp(48px,14vw,64px);
  display:flex;align-items:center;justify-content:center;
  transition:transform .05s;
}
.ctrl-btn.ctrl-flee{flex:0 0 auto;width:clamp(48px,14vw,64px)}
#btnRoll{position:absolute;left:50%;transform:translateX(-50%);width:clamp(160px,44vw,220px);height:clamp(60px,17vw,80px);z-index:1}
#btnRoll:active{transform:translateX(-50%) scale(.95)}
#btnBank{flex:0 0 clamp(100px,28vw,136px)}
.ctrl-spacer{display:none}
.ctrl-btn:active{transform:scale(.95);filter:brightness(1.4)}
.ctrl-btn.btn-flash{animation:btnFlash .3s ease-out}
@keyframes btnFlash{0%{filter:brightness(1.5)}100%{filter:brightness(1)}}
.ctrl-btn:disabled{opacity:.3;cursor:default;transform:none!important}
#btnRoll:disabled{transform:translateX(-50%)!important}
.ctrl-btn .btn-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:auto;z-index:0;pointer-events:none}

/* ─── ACTIVE CARDS ─── */
.mcard-active .gcard{animation:activeGlow 2s ease-in-out infinite;border:1px solid #ffd700}
@keyframes activeGlow{0%,100%{box-shadow:0 0 6px 2px rgba(255,215,0,.4)}50%{box-shadow:0 0 14px 5px rgba(255,215,0,.7)}}
.mcard-active.used .gcard{animation:none;box-shadow:none;filter:grayscale(1) brightness(.5);border-color:#555}
.active-drop-zone{display:none;position:absolute;left:10%;right:10%;bottom:0;height:48px;
  border:2px dashed rgba(255,215,0,.5);border-radius:10px;background:rgba(255,215,0,.08);
  z-index:50;pointer-events:none;transition:opacity .3s}
.active-drop-zone.visible{display:block;animation:dropPulse 1.5s ease-in-out infinite}
@keyframes dropPulse{0%,100%{border-color:rgba(255,215,0,.4)}50%{border-color:rgba(255,215,0,.9)}}

/* ─── OVERLAYS ─── */
#bust-ov{
  position:fixed;inset:0;z-index:9000;pointer-events:none;
  display:flex;align-items:center;justify-content:center;opacity:0;
}
#bust-ov.flash{animation:bFlash 1s ease-out forwards,bustShake .45s ease-out}
@keyframes bFlash{0%{background:rgba(140,6,6,.5);opacity:1}50%{background:rgba(100,4,4,.25);opacity:1}100%{background:transparent;opacity:0}}
@keyframes bustShake{0%,100%{transform:translateX(0)}15%{transform:translateX(-8px)}30%{transform:translateX(7px)}45%{transform:translateX(-6px)}60%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.bust-word{
  font-family:'Uncial Antiqua',serif;font-size:clamp(28px,9vw,52px);
  color:#c85050;letter-spacing:6px;
  text-shadow:0 0 24px rgba(200,80,80,.5);
  transform:scale(.5);opacity:0;
}
#bust-ov.flash .bust-word{animation:bustPop 1s cubic-bezier(.2,.8,.4,1) forwards}
@keyframes bustPop{0%{transform:scale(.5);opacity:0}18%{transform:scale(.88);opacity:1}100%{transform:scale(1.8);opacity:0}}

#turn-ov{
  position:fixed;inset:0;z-index:8900;pointer-events:none;
  display:flex;align-items:center;justify-content:center;opacity:0;
}
#turn-ov.flash{animation:tFlash .9s ease-out forwards}
@keyframes tFlash{0%{opacity:1}60%{opacity:.6}100%{opacity:0}}
.turn-word{
  font-family:'Uncial Antiqua',serif;font-size:clamp(28px,9vw,52px);
  color:var(--gold);letter-spacing:6px;
  text-shadow:0 0 24px rgba(200,160,80,.35);
  transform:scale(0.5);opacity:0;
}
#turn-ov.flash .turn-word{animation:turnPop .9s cubic-bezier(.2,.8,.4,1) forwards}
@keyframes turnPop{0%{transform:scale(.5);opacity:0}20%{transform:scale(.85);opacity:1}100%{transform:scale(1.8);opacity:0}}

/* HOT DICE overlay (matches YOUR TURN / BUST style) */
#hot-ov{
  position:fixed;inset:0;z-index:8950;pointer-events:none;
  display:flex;align-items:center;justify-content:center;opacity:0;
}
#hot-ov.flash{animation:hFlash 1s ease-out forwards}
@keyframes hFlash{0%{background:rgba(180,140,30,.5);opacity:1}50%{background:rgba(140,105,20,.25);opacity:1}100%{background:transparent;opacity:0}}
.hot-word{
  font-family:'Uncial Antiqua',serif;font-size:clamp(28px,9vw,52px);
  color:var(--gold);letter-spacing:6px;white-space:nowrap;
  text-shadow:0 0 24px rgba(200,160,80,.5);
  transform:scale(.5);opacity:0;
}
#hot-ov.flash .hot-word{animation:hotPop 1s cubic-bezier(.2,.8,.4,1) forwards}
@keyframes hotPop{0%{transform:scale(.5);opacity:0}18%{transform:scale(.88);opacity:1}100%{transform:scale(1.8);opacity:0}}

/* Perfect straight radial glow */
#perfectGlow{
  position:absolute;inset:0;z-index:70;pointer-events:none;overflow:hidden;opacity:0;
}
#perfectGlow.flash{animation:perfFade 1.6s ease-out forwards}
@keyframes perfFade{0%{opacity:0}12%{opacity:1}70%{opacity:.8}100%{opacity:0}}
#perfectGlow .perf-ring{
  position:absolute;top:var(--glow-y,75%);left:50%;width:0;height:0;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,210,80,.25) 0%,rgba(200,160,60,.12) 40%,transparent 70%);
  transform:translate(-50%,-50%);
}
#perfectGlow.flash .perf-ring{animation:perfGrow 1.6s ease-out forwards}
@keyframes perfGrow{0%{width:0;height:0}100%{width:200vw;height:200vw}}
#perfectGlow .perf-dither{
  position:absolute;inset:0;
  background:repeating-conic-gradient(rgba(200,160,60,.2) 0% 25%, transparent 0% 50%) 0 0/6px 6px;
  -webkit-mask-image:radial-gradient(circle at 50% var(--glow-y,75%),black 0%,transparent 70%);
  mask-image:radial-gradient(circle at 50% var(--glow-y,75%),black 0%,transparent 70%);
  image-rendering:pixelated;opacity:0;
}
#perfectGlow.flash .perf-dither{animation:perfDither 1.6s ease-out forwards}
@keyframes perfDither{0%{opacity:0}15%{opacity:.8}60%{opacity:.5}100%{opacity:0}}

.perf-spark{
  position:absolute;width:3px;height:3px;border-radius:1px;pointer-events:none;
  background:rgba(255,210,80,.9);box-shadow:0 0 5px rgba(255,200,60,.7),0 0 10px rgba(255,180,40,.3);
  opacity:0;animation:sparkBurst 2s ease-out forwards;
}
@keyframes sparkBurst{
  0%{transform:translate(0,0) scale(1);opacity:0}
  6%{opacity:.95}
  30%{opacity:.8;transform:translate(calc(var(--dx)*.4),calc(var(--dy)*.4)) scale(1.2)}
  65%{opacity:.4}
  100%{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}
}

.spop{
  position:absolute;pointer-events:none;z-index:60;
  font-family:var(--font-px);font-size:15px;color:var(--gold);text-shadow:1px 1px 0 #000;
  animation:sPop .7s steps(4) forwards;
}
@keyframes sPop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}

/* ─── END MATCH OVERLAY ─── */
#end-ov{
  display:none;position:fixed;inset:0;z-index:9500;
  background:#0c0a06;
  flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-bottom:8vh;
  padding:24px;
  image-rendering:pixelated;
}
#end-ov::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(
    180deg,
    transparent 0px,transparent 2px,
    rgba(30,24,16,.08) 2px,rgba(30,24,16,.08) 4px
  );
  mix-blend-mode:screen;
}
#end-ov>*{position:relative;z-index:1}
#end-ov.show{display:flex}
.res-title{font-family:'Uncial Antiqua',serif;font-size:clamp(38px,12vw,64px);letter-spacing:8px}
.res-title.win{color:var(--gold);text-shadow:3px 3px 0 #000,0 0 28px rgba(200,160,80,.55)}
.res-title.lose{color:var(--red);text-shadow:3px 3px 0 #000,0 0 28px rgba(160,80,80,.45)}
.res-scores{display:flex;gap:36px;align-items:center}
.res-num{font-size:clamp(28px,9vw,48px)}
.res-lbl{font-family:'Enchanted Land',serif;font-size:clamp(18px,5vw,26px);color:var(--textdim);letter-spacing:2px;margin-top:4px}
/* gold display — big coin + text */
.res-gold-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.res-coin-big{
  width:90px;height:90px;border-radius:50%;position:relative;overflow:hidden;
  background:radial-gradient(circle at 38% 35%,#ffe080 0%,#d4a840 50%,#a07820 100%);
  box-shadow:0 0 22px rgba(200,160,60,.55),inset 0 -5px 0 rgba(0,0,0,.3),inset 0 3px 0 rgba(255,240,180,.4);
  border:3px solid #8a6820;
  filter:url(#pixelWobble);image-rendering:pixelated;-ms-interpolation-mode:nearest-neighbor;
}
.res-coin-big::after{
  content:'';position:absolute;inset:10px;border-radius:50%;
  border:2px solid rgba(140,100,30,.5);
  background:radial-gradient(circle at 40% 36%,rgba(255,240,180,.3),transparent 60%);
}
.res-coin-amt{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-px);font-size:20px;color:rgba(120,85,25,.8);
  text-shadow:0 1px 0 rgba(255,240,180,.3);z-index:1;
  line-height:1;
}
/* sheen sweep */
.res-coin-sheen{
  position:absolute;inset:0;border-radius:50%;overflow:hidden;pointer-events:none;z-index:2;
}
.res-coin-sheen::before{
  content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);
  opacity:0;
}
.res-coin-big.sheen .res-coin-sheen::before{animation:coinSheen .6s ease-in-out forwards}
@keyframes coinSheen{0%{left:-100%;opacity:0}15%{opacity:1}100%{left:140%;opacity:0}}
.res-coin-big.spin{animation:coinBigSpin .9s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes coinBigSpin{
  0%{transform:scale(0) rotate(0deg);opacity:0}
  15%{opacity:1}
  40%{transform:scale(1.25) rotate(15deg)}
  55%{transform:scale(1.05) rotate(-8deg)}
  70%{transform:scale(1.12) rotate(4deg)}
  85%{transform:scale(1) rotate(-2deg)}
  100%{transform:scale(1) rotate(0deg);opacity:1}
}
.res-coin-big.charge{animation:coinCharge .7s ease-in forwards}
@keyframes coinCharge{
  0%{transform:scale(1) translate(0,0);filter:url(#pixelWobble) brightness(1)}
  15%{transform:scale(1.02) translate(-2px,1px);filter:url(#pixelWobble) brightness(1.2)}
  30%{transform:scale(1.05) translate(3px,-1px);filter:url(#pixelWobble) brightness(1.4)}
  45%{transform:scale(1.08) translate(-3px,2px);filter:url(#pixelWobble) brightness(1.7)}
  60%{transform:scale(1.12) translate(2px,-2px);filter:url(#pixelWobble) brightness(2)}
  75%{transform:scale(1.18) translate(-1px,1px);filter:url(#pixelWobble) brightness(2.5)}
  90%{transform:scale(1.22) translate(1px,-1px);filter:url(#pixelWobble) brightness(3)}
  100%{transform:scale(1.25) translate(0,0);filter:url(#pixelWobble) brightness(3.5)}
}
.res-coin-big.burst{animation:coinBurst .25s ease-out forwards}
@keyframes coinBurst{0%{transform:scale(1.25);filter:url(#pixelWobble) brightness(3.5);opacity:1}100%{transform:scale(2);filter:url(#pixelWobble) brightness(5);opacity:0}}
.res-gold-text{
  font-size:clamp(22px,6vw,32px);color:var(--gold);letter-spacing:2px;
  text-shadow:0 0 8px rgba(200,160,60,.4);margin-top:10px;
}
.res-gold-text.drift{animation:goldDrift 2s ease-out forwards}
@keyframes goldDrift{
  0%{transform:translateY(0);opacity:0}
  12%{opacity:1}
  50%{opacity:1;transform:translateY(-8px)}
  100%{transform:translateY(-24px);opacity:0}
}
/* defeat: coin drains — shrinks + goes dark brownish-red */
.res-coin-big.drain{animation:coinDrain .8s ease-in forwards}
@keyframes coinDrain{
  0%{transform:scale(1) translate(0,0);filter:url(#pixelWobble) brightness(1) saturate(1)}
  15%{transform:scale(.97) translate(-1px,1px);filter:url(#pixelWobble) brightness(.9) saturate(.8)}
  30%{transform:scale(.93) translate(2px,-1px);filter:url(#pixelWobble) brightness(.75) saturate(.6) hue-rotate(-15deg)}
  50%{transform:scale(.88) translate(-2px,1px);filter:url(#pixelWobble) brightness(.6) saturate(.4) hue-rotate(-25deg)}
  70%{transform:scale(.82) translate(1px,-1px);filter:url(#pixelWobble) brightness(.45) saturate(.3) hue-rotate(-35deg)}
  100%{transform:scale(.75) translate(0,0);filter:url(#pixelWobble) brightness(.35) saturate(.2) hue-rotate(-40deg)}
}
.res-coin-big.drain-burst{animation:coinDrainBurst .3s ease-out forwards}
@keyframes coinDrainBurst{
  0%{transform:scale(.75);filter:url(#pixelWobble) brightness(.35) saturate(.2) hue-rotate(-40deg);opacity:1}
  100%{transform:scale(.3);filter:url(#pixelWobble) brightness(.1) saturate(0) hue-rotate(-40deg);opacity:0}
}
/* loss particles — darker tinted coins */
.coin-burst-p.loss{
  background:radial-gradient(circle at 38% 35%,#c89060,#8a6040);
  border-color:#6a4830;
  box-shadow:0 0 3px rgba(160,100,60,.5),inset 0 -1px 0 rgba(0,0,0,.3);
}

/* mini coins — firework burst */
.coin-burst-p{
  position:fixed;border-radius:50%;pointer-events:none;z-index:9502;
  background:radial-gradient(circle at 38% 35%,#ffe080,#c8a040);
  box-shadow:0 0 4px rgba(200,160,60,.6),inset 0 -1px 0 rgba(0,0,0,.3);
  border:1px solid #8a6820;
  opacity:0;
}

#btnContinue{
  font-family:var(--font-px);font-size:16px;letter-spacing:2px;
  color:var(--gold);background:rgba(40,28,14,.9);
  border:2px solid var(--gold);border-radius:4px;
  padding:12px 32px;cursor:pointer;
  position:absolute;bottom:28px;left:50%;transform:translateX(-50%);
  transition:filter .15s;
}
#btnContinue:hover{filter:brightness(1.3)}
#btnContinue:active{filter:brightness(1.5);transform:translateX(-50%) scale(.97)}

/* victory animations */
#end-ov .res-title{opacity:0}
.res-title.pop{animation:resPop .6s cubic-bezier(.2,.8,.35,1) forwards}
@keyframes resPop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:1}}
#end-ov .res-scores,#end-ov .res-gold-wrap{opacity:0}
.res-gold-wrap.fade-in,.res-scores.fade-in{animation:resFade .5s ease forwards}
#btnContinue.fade-in{animation:btnFade .5s ease forwards}
@keyframes resFade{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
@keyframes btnFade{0%{opacity:0;transform:translateX(-50%) translateY(10px)}100%{opacity:1;transform:translateX(-50%) translateY(0)}}

/* card reveal */
.res-card{display:none;perspective:400px;margin:-10px 0 0;position:relative;width:100px;height:150px;align-self:center}
.res-card.show{display:block}
.res-card .gcard{width:100%;height:100%;border-width:2px;border-radius:5px;animation:cardRevealSpin 1s ease-out forwards}
.res-card .gcard-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;image-rendering:pixelated;pointer-events:none}
.res-card .gcard-frame{position:absolute;top:4px;left:4px;right:4px;bottom:4px;border-radius:2px;pointer-events:none;z-index:1;border:1px solid var(--ctrim2);opacity:.7}
.res-card .gc{width:10px;height:10px}
.res-card .gc.tl{top:4px;left:4px}.res-card .gc.tr{top:4px;right:4px}
.res-card .gc.bl{bottom:4px;left:4px}.res-card .gc.br{bottom:4px;right:4px}
.res-card .gcard-band{font-size:6px;padding:2px 6px}
.res-card-glow{
  position:absolute;inset:-8px;border-radius:8px;z-index:-1;
  background:radial-gradient(circle,rgba(255,210,80,.3) 0%,transparent 70%);
  animation:cardGlowPulse 1.5s ease-in-out infinite alternate;
}
@keyframes cardRevealSpin{0%{transform:rotateY(180deg) scale(.6);opacity:0}50%{transform:rotateY(360deg) scale(1.05);opacity:1}100%{transform:rotateY(360deg) scale(1);opacity:1}}
@keyframes cardGlowPulse{0%{opacity:.5;transform:scale(.95)}100%{opacity:1;transform:scale(1.05)}}

/* ─── QUIT CONFIRM ─── */
#quit-ov{
  display:none;position:fixed;inset:0;z-index:9600;
  background:rgba(12,10,6,.88);
  flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:24px;
}
#quit-ov.show{display:flex}
.quit-title{font-family:'Uncial Antiqua',serif;font-size:clamp(18px,5vw,28px);color:var(--red);letter-spacing:4px}
.quit-sub{font-size:9px;color:var(--textdim);text-align:center;line-height:2.2;max-width:280px}
.quit-btns{display:flex;gap:12px}
.quit-btn{
  position:relative;border:none;cursor:pointer;
  font-family:var(--font-px);font-size:16px;letter-spacing:2px;
  color:var(--text);background:transparent;
  padding:12px 24px;
}
.quit-btn canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0;border-radius:3px}
.quit-btn span{position:relative;z-index:1}

/* ─── CONTROLS DITHER FRINGE ─── */
.controls::before{
  content:'';position:absolute;left:0;right:0;bottom:100%;height:18px;
  pointer-events:none;z-index:2;
  background:repeating-conic-gradient(rgba(30,18,10,.95) 0% 25%, transparent 0% 50%) 0 0/4px 4px;
  -webkit-mask-image:linear-gradient(to top, black 0%, rgba(0,0,0,.85) 15%, rgba(0,0,0,.6) 30%, rgba(0,0,0,.3) 50%, transparent 70%);
  mask-image:linear-gradient(to top, black 0%, rgba(0,0,0,.85) 15%, rgba(0,0,0,.6) 30%, rgba(0,0,0,.3) 50%, transparent 70%);
  image-rendering:pixelated;
}

/* ─── LOADOUT FAB ─── */
.loadout-fab{
  position:fixed;bottom:130px;right:14px;z-index:80;
  width:56px;height:56px;
  background:transparent;border:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  filter:none;
  transition:transform .1s;
}
.loadout-fab:active{transform:scale(.9)}
.loadout-fab-img{width:100%;height:100%;image-rendering:pixelated;object-fit:contain}

/* ─── LOADOUT PANEL ─── */
.lo-backdrop{
  position:fixed;inset:0;z-index:9500;
  background:rgba(0,0,0,.6);opacity:0;pointer-events:none;
  transition:opacity .3s ease;
}
.lo-backdrop.on{opacity:1;pointer-events:auto}
#loadout-ov{
  position:fixed;left:0;right:0;bottom:0;z-index:9600;
  transform:translateY(100%);transition:transform .3s ease;
  border-top:none;
  padding:0;overflow:visible;
}
#loadout-ov.show{transform:translateY(0)}
.lo-canvas{position:absolute;inset:0;image-rendering:pixelated}
.lo-portrait{
  position:absolute;z-index:3;
  left:50%;transform:translateX(-50%) scale(.5);
  top:-100px;
  width:160px;height:160px;
  overflow:visible;display:flex;align-items:flex-end;justify-content:center;
  pointer-events:none;
  opacity:0;
  transition:opacity .25s ease, transform .3s ease;
}
#loadout-ov.show .lo-portrait{
  opacity:1;
  transform:translateX(-50%) scale(1);
}
.lo-portrait img{max-width:160px;max-height:160px;image-rendering:auto;object-fit:contain;filter:drop-shadow(0 4px 12px rgba(0,0,0,.7))}
.lo-inner{
  position:relative;z-index:2;
  padding:14px 16px 28px;
  overflow-y:auto;
  display:flex;flex-direction:column;align-items:center;gap:14px;
}
.lo-inner .handle{width:36px;height:3px;background:var(--textdim);margin:0 auto 12px}
.lo-actions{display:flex;gap:10px;margin-top:10px;padding-top:14px;border-top:1px solid rgba(255,255,255,.04);width:100%}
.lo-actions .btn{
  flex:1;padding:18px 6px;
  font-family:var(--font-px);font-size:18px;letter-spacing:1.5px;
  text-align:center;cursor:pointer;border:none;
  position:relative;overflow:hidden;
  transition:filter .08s,transform .06s;background:transparent;
}
.lo-actions .btn canvas{position:absolute;inset:0;image-rendering:pixelated}
.lo-actions .btn .btn-inner{position:relative;z-index:2;color:var(--textdim)}
.lo-actions .btn:active{transform:scale(.95);filter:brightness(1.15)}
.lo-title{
  font-family:'Uncial Antiqua',serif;font-size:clamp(18px,5vw,26px);
  color:var(--gold);letter-spacing:3px;
  margin-top:-4px;margin-bottom:2px;
  text-transform:uppercase;
}
.lo-gold-corner{
  position:absolute;top:14px;left:16px;z-index:3;
  display:flex;align-items:center;gap:4px;
  font-family:var(--font-px);font-size:16px;color:var(--gold);letter-spacing:1px;
  line-height:1;
}
.lo-gold-corner .lo-coin{font-size:14px;line-height:1;vertical-align:middle}
.lo-gold-corner #loGold{display:inline-block;vertical-align:middle;position:relative;top:2px}
.lo-decree{
  width:100%;text-align:center;
  padding:5px 8px;border:1px solid rgba(160,80,80,.25);
  background:rgba(40,16,16,.5);border-radius:3px;
  margin-top:4px;
}
.lo-decree-txt{
  font-family:'Enchanted Land',serif;font-size:15px;letter-spacing:1px;
  color:var(--red);opacity:.85;letter-spacing:.5px;line-height:1.4;
}
.lo-gold{
  font-size:10px;color:var(--gold);letter-spacing:1px;
  padding:4px 12px;border:1px solid var(--golddim);
  background:rgba(20,16,8,.85);border-radius:3px;
}
.lo-cols{
  display:flex;gap:0;width:100%;max-width:420px;justify-content:center;
}
.lo-col{
  flex:1;min-width:0;display:flex;flex-direction:column;
  align-items:center;padding:4px 8px;gap:12px;
}
.lo-divider{
  width:2px;flex-shrink:0;
  background:linear-gradient(180deg,transparent,var(--gold),transparent);opacity:.3;
}
.lo-col-hdr{font-size:8px;letter-spacing:2px}
.lo-col-hdr.you{color:var(--gold)}
.lo-col-hdr.opp{color:var(--red)}
.lo-dice-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;justify-items:center}
.lo-dice-row .die{width:clamp(34px,9vw,42px)!important;height:clamp(34px,9vw,42px)!important}
.lo-cards-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.lo-mini-card{
  width:56px;aspect-ratio:2/3;border-radius:5px;overflow:hidden;
  position:relative;flex-shrink:0;
}
.lo-mini-card .gcard{width:100%;height:100%;border-width:2px}
.lo-mini-card .gcard-art{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;z-index:0;image-rendering:pixelated;pointer-events:none
}
.lo-mini-card .gcard-frame{position:absolute;top:4px;left:4px;right:4px;bottom:4px;border-radius:2px;pointer-events:none;z-index:1;border:1px solid var(--ctrim2);opacity:.7}
.lo-mini-card .gc{width:10px;height:10px}
.lo-mini-card .gc.tl{top:4px;left:4px}
.lo-mini-card .gc.tr{top:4px;right:4px}
.lo-mini-card .gc.bl{bottom:4px;left:4px}
.lo-mini-card .gc.br{bottom:4px;right:4px}
.lo-none{font-size:7px;color:var(--textdim);letter-spacing:1px}

/* ── wobble / float animations for loadout items ── */
@keyframes loFloat{
  0%,100%{transform:translateY(0) rotate(0deg)}
  25%{transform:translateY(-2px) rotate(.4deg)}
  50%{transform:translateY(-3.5px) rotate(-.3deg)}
  75%{transform:translateY(-1px) rotate(.2deg)}
}
.lo-mini-card{
  animation:loFloat var(--lo-dur,3.5s) ease-in-out var(--lo-del,0s) infinite;
}
</style>
</head>
<body>

<!-- SVG filter -->
<svg style="position:absolute;width:0;height:0">
  <filter id="pixelWobble"><feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="pixelWobbleLite"><feTurbulence type="turbulence" baseFrequency="0.008" numOctaves="1" seed="3" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="2.8" xChannelSelector="R" yChannelSelector="G"/></filter>
</svg>

<!-- TOP BAR -->
<div class="top-bar">
  <div class="title">
    <span class="letter">F</span><span class="letter">a</span><span class="letter">r</span><span class="letter">K</span><span class="letter">!</span>
  </div>
  <div class="gold-pill" id="goldPill" style="display:none">&#x1FA99; <span id="goldAmt">320</span></div>
</div>

<!-- HUD -->
<div class="hud" id="hud">
  <div class="hud-block">
    <div class="hud-lbl">YOU</div>
    <div class="hud-score p" id="pScore">0</div>
    <div class="prog"><div class="prog-fill p" id="pProg" style="width:0%"></div></div>
  </div>
  <div class="hud-mid">
    <div class="hud-tgt-lbl">TARGET</div>
    <div class="hud-target" id="targetScore">3500</div>
    <div class="hud-turn-pts" id="turnPts" style="display:none"></div>
    <div class="hud-turnnum" id="turnNum">TURN 1</div>
  </div>
  <div class="hud-block">
    <div class="hud-lbl" id="oppName">DRUNKARD <span id="skillIcon" style="display:none;cursor:pointer;color:var(--red);font-size:11px" onclick="toggleLoadoutPanel()" title="Skill active">&#9889;</span></div>
    <div class="hud-score o" id="oScore">0</div>
    <div class="prog"><div class="prog-fill o" id="oProg" style="width:0%"></div></div>
  </div>
</div>

<!-- EDICT (hidden, replaced by skill icon in HUD) -->
<div class="edict-bar" id="edictBar" style="display:none!important"></div>

<!-- OPP CARD BAR -->
<div class="card-bar top" id="oppCards">
  <span class="bar-lbl">OPP:</span>
</div>

<!-- DICE AREA -->
<div class="dice-area" id="diceArea">
  <div id="perfectGlow"><div class="perf-ring"></div><div class="perf-dither"></div></div>
  <!-- Opponent dice row -->
  <div class="opp-dice-row" id="oppDiceRow"></div>

  <div class="dice-sep"></div>

  <!-- Status strip top -->
  <div class="status-strip" id="topStrip">
    <div class="status-msg" id="statusTop"></div>
  </div>

  <!-- Dialogue box -->
  <div class="dlg-box" id="dlgBox">
    <div class="dlg-inner">
      <div class="dlg-portrait" id="dlgPortrait">
        <img id="dlgImg" src="" alt="">
      </div>
      <div class="dlg-scroll" id="dlgScroll">
        <canvas id="dlgCanvas"></canvas>
        <div class="dlg-text" id="dlgText">"Welcome to the table, stranger."</div>
      </div>
    </div>
  </div>

  <!-- Active card drop zone -->
  <div class="active-drop-zone" id="activeDropZone"></div>

  <!-- Player dice row -->
  <div class="player-dice-row" id="playerDiceRow"></div>

  <!-- Kept tray -->
  <div class="kept-tray" id="keptTray"></div>

  <!-- Status strip bottom -->
  <div class="status-strip" id="botStrip">
    <div class="status-msg" id="statusBot"></div>
  </div>
</div>

<!-- PLAYER CARD BAR (fanned, tucked under controls) -->
<div class="card-bar bot" id="playerCards"></div>

<!-- CONTROLS -->
<div class="controls" id="controls">
  <button class="ctrl-btn ctrl-flee" id="btnQuit" onclick="showQuitConfirm()">
    <img class="btn-bg" src="Match_Art/flee.png" alt="Flee">
  </button>
  <div class="ctrl-spacer"></div>
  <button class="ctrl-btn" id="btnRoll" onclick="handleRoll()">
    <img class="btn-bg" src="Match_Art/roll.png" alt="Roll">
  </button>
  <div class="ctrl-spacer"></div>
  <button class="ctrl-btn" id="btnBank" onclick="handleBank()" disabled>
    <img class="btn-bg" src="Match_Art/bank.png" alt="Bank">
  </button>
</div>

<!-- DEBUG -->
<div style="position:fixed;top:6px;right:6px;z-index:9999;display:flex;gap:4px">
  <button onclick="endMatch(true)" style="padding:4px 8px;font-size:10px;background:#2a2;color:#fff;border:none;border-radius:4px;cursor:pointer;opacity:.7">DBG WIN</button>
  <button onclick="endMatch(false)" style="padding:4px 8px;font-size:10px;background:#a22;color:#fff;border:none;border-radius:4px;cursor:pointer;opacity:.7">DBG LOSE</button>
</div>

<!-- OVERLAYS -->

<script>
/* ═══════ PERSISTENT STATE (from localStorage) ═══════ */
let S = (()=>{ try{ return JSON.parse(localStorage.getItem('gambit4'))||null; }catch(e){ return null; } })()||null;
if(!S) S={gold:100,wins:0,currentRung:0,matchCount:0,dice:['bone','bone','bone','bone','bone','bone'],cards:[],tarnish:{},seenTips:{},settings:{diceStyle:'2d'}};
if(!S.settings) S.settings={diceStyle:'2d'};
if(S.matchCount===undefined) S.matchCount=0;
if(!S.ownedDice) S.ownedDice=[...(S.dice||['bone','bone','bone','bone','bone','bone'])];
if(!S.npcRewards) S.npcRewards={};
function save(){ try{ localStorage.setItem('gambit4',JSON.stringify(S)); }catch(e){} }

/* ═══════ UTILITY FUNCTIONS ═══════ */
function mkRand(seed){let s=seed;return function(){s=(s*9301+49297)%233280;return s/233280}}
function parseCol(hex){return[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]}
function lerpCol(a,b,t){return a.map((v,i)=>Math.round(v+(b[i]-v)*t))}
function genWobble(len,rand,freq){
  freq=freq||0.025;
  const w=new Int8Array(len);let pos=0;
  for(let i=0;i<len;i++){
    if(rand()<freq) pos=rand()<0.5?1:(rand()<0.5?-1:0);
    w[i]=pos;
  }
  return w;
}

function sizeAndDrawPanel(canvas,bevelCol,faceCol,shadowCol,seed,wobbleFreq){
  if(!canvas)return;
  const w=canvas.offsetWidth,h=canvas.offsetHeight;
  if(w<2||h<2)return;
  canvas.width=w;canvas.height=h;
  canvas.style.width='100%';canvas.style.height='100%';
  drawPixelPanel(canvas,bevelCol,faceCol,shadowCol,seed,wobbleFreq);
}
function drawPixelPanel(canvas,bevelCol,faceCol,shadowCol,seed,wobbleFreq){
  const W=canvas.width,H=canvas.height;
  if(W<2||H<2)return;
  const ctx=canvas.getContext('2d');
  ctx.imageSmoothingEnabled=false;
  const rand=mkRand(seed);
  const bevel=parseCol(bevelCol);
  const bevelDark=bevel.map(c=>Math.max(0,c-35));
  const face=parseCol(faceCol);
  const faceLt=face.map(c=>Math.min(255,c+10));
  const faceDk=face.map(c=>Math.max(0,c-8));
  const shadow=parseCol(shadowCol);
  const R=7,B=3,BEV=2;
  const TOTAL=B+BEV;
  const wf=wobbleFreq||0.025;
  const wT=genWobble(W,rand,wf),wB=genWobble(W,rand,wf);
  const wL=genWobble(H,rand,wf),wR=genWobble(H,rand,wf);
  function distFromEdge(x,y){
    const eT=wT[Math.min(x,W-1)],eB=H-1+wB[Math.min(x,W-1)];
    const eL=wL[Math.min(y,H-1)],eR=W-1+wR[Math.min(y,H-1)];
    const dT=y-eT,dB=eB-y,dL=x-eL,dR=eR-x;
    if(dL<R&&dT<R){const dx=R-dL,dy=R-dT;return R-Math.sqrt(dx*dx+dy*dy)}
    if(dR<R&&dT<R){const dx=R-dR,dy=R-dT;return R-Math.sqrt(dx*dx+dy*dy)}
    if(dL<R&&dB<R){const dx=R-dL,dy=R-dB;return R-Math.sqrt(dx*dx+dy*dy)}
    if(dR<R&&dB<R){const dx=R-dR,dy=R-dB;return R-Math.sqrt(dx*dx+dy*dy)}
    return Math.min(dT,dB,dL,dR);
  }
  const imgData=ctx.createImageData(W,H);const d=imgData.data;
  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      const idx=(y*W+x)*4;
      const dist=distFromEdge(x,y);
      if(dist<0)continue;
      let r,g,b;
      if(dist<1){r=shadow[0];g=shadow[1];b=shadow[2];}
      else if(dist<B){
        if((y<H/2)||(x<W/2)){r=bevel[0];g=bevel[1];b=bevel[2]}
        else{r=bevelDark[0];g=bevelDark[1];b=bevelDark[2]}
      }else if(dist<TOTAL){
        if((y<H/2)||(x<W/2)){const bl=bevel.map(c=>Math.max(0,c-15));r=bl[0];g=bl[1];b=bl[2];}
        else{r=shadow[0];g=shadow[1];b=shadow[2];}
      }else{
        const gy=y/H;const checker=((x+y)%2===0);const t=gy*0.5;
        const col=checker?lerpCol(faceLt,faceDk,t):lerpCol(faceLt,faceDk,t+0.12);
        r=col[0];g=col[1];b=col[2];
      }
      const nz=Math.floor((rand()-0.5)*4);
      d[idx]=Math.max(0,Math.min(255,r+nz));
      d[idx+1]=Math.max(0,Math.min(255,g+nz));
      d[idx+2]=Math.max(0,Math.min(255,b+nz));
      d[idx+3]=255;
    }
  }
  ctx.putImageData(imgData,0,0);
}
function drawPixelScroll(canvas){
  const W=canvas.width=canvas.offsetWidth*2,H=canvas.height=canvas.offsetHeight*2;
  if(W<10||H<10)return;
  const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
  const rand=mkRand(7771);
  const marginH=Math.round(W*0.05);
  const marginV=Math.round(H*0.06);
  const parchLt=[195,175,140],parchDk=[155,135,100];
  const edgeColor=[120,100,70];
  const imgData=ctx.createImageData(W,H);const d=imgData.data;
  function setP(x,y,r,g,b,a){
    if(x<0||x>=W||y<0||y>=H)return;
    const i=(y*W+x)*4;const nz=Math.floor((rand()-.5)*8);
    d[i]=Math.max(0,Math.min(255,r+nz));d[i+1]=Math.max(0,Math.min(255,g+nz));d[i+2]=Math.max(0,Math.min(255,b+nz));d[i+3]=a!==undefined?a:255;
  }
  /* Wobble arrays for all 4 edges */
  const wobbleL=new Int8Array(H),wobbleR=new Int8Array(H);
  let wl=0,wr=0;
  for(let y=0;y<H;y++){
    if(rand()<0.08)wl+=(rand()<.5?1:-1);wl=Math.max(-3,Math.min(3,wl));wobbleL[y]=wl;
    if(rand()<0.08)wr+=(rand()<.5?1:-1);wr=Math.max(-3,Math.min(3,wr));wobbleR[y]=wr;
  }
  const wobbleT=new Int8Array(W),wobbleB=new Int8Array(W);
  let wt=0,wb=0;
  for(let x=0;x<W;x++){
    if(rand()<0.1)wt+=(rand()<.5?1:-1);wt=Math.max(-3,Math.min(3,wt));wobbleT[x]=wt;
    if(rand()<0.1)wb+=(rand()<.5?1:-1);wb=Math.max(-3,Math.min(3,wb));wobbleB[x]=wb;
  }
  /* Rips on all 4 edges */
  const rips=[];
  for(let i=0;i<3;i++){const ry=Math.floor(rand()*H);const side=rand()<.5?'left':'right';rips.push({pos:ry,side,depth:2+Math.floor(rand()*4),span:3+Math.floor(rand()*5)});}
  for(let i=0;i<2;i++){const rx=Math.floor(marginH+rand()*(W-2*marginH));const side=rand()<.5?'top':'bottom';rips.push({pos:rx,side,depth:2+Math.floor(rand()*3),span:4+Math.floor(rand()*6)});}
  function isOutside(x,y){
    const tEdge=marginV+wobbleT[x]||marginV;
    const bEdge=H-marginV+((wobbleB[x])||0);
    if(y<tEdge||y>=bEdge)return true;
    const lEdge=marginH+(wobbleL[y]||0);
    const rEdge=W-marginH+(wobbleR[y]||0);
    if(x<lEdge||x>=rEdge)return true;
    /* Check rips */
    for(let i=0;i<rips.length;i++){const rp=rips[i];
      if(rp.side==='left'||rp.side==='right'){
        if(y>=rp.pos&&y<rp.pos+rp.span){const p=(y-rp.pos)/rp.span;const rd=Math.round(rp.depth*Math.sin(p*Math.PI));
          if(rp.side==='left'&&x<lEdge+rd+2)return true;
          if(rp.side==='right'&&x>rEdge-rd-2)return true;}
      }else{
        if(x>=rp.pos&&x<rp.pos+rp.span){const p=(x-rp.pos)/rp.span;const rd=Math.round(rp.depth*Math.sin(p*Math.PI));
          if(rp.side==='top'&&y<tEdge+rd+2)return true;
          if(rp.side==='bottom'&&y>bEdge-rd-2)return true;}
      }
    }
    return false;
  }
  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      if(isOutside(x,y))continue;
      const gy=y/H;const checker=(x+y)%2===0;const t=gy*.3+(checker?.03:0);
      const stainVal=Math.sin(x*0.15)*Math.sin(y*0.12)*0.15;const st=Math.max(0,stainVal);
      const r=Math.round(parchLt[0]+(parchDk[0]-parchLt[0])*t-st*30);
      const g=Math.round(parchLt[1]+(parchDk[1]-parchLt[1])*t-st*25);
      const b=Math.round(parchLt[2]+(parchDk[2]-parchLt[2])*t-st*20);
      setP(x,y,r,g,b);
    }
  }
  /* Edge darkening pass */
  for(let y=0;y<H;y++){for(let x=0;x<W;x++){
    if(isOutside(x,y))continue;
    if(!isOutside(x,y)&&(isOutside(x-1,y)||isOutside(x+1,y)||isOutside(x,y-1)||isOutside(x,y+1))){
      setP(x,y,edgeColor[0],edgeColor[1],edgeColor[2]);
    }
  }}
  ctx.putImageData(imgData,0,0);
}

/* ═══════ SFX ENGINE ═══════ */
const SFX={
  _ctx:null,
  _get(){if(!this._ctx)this._ctx=new(window.AudioContext||window.webkitAudioContext)();if(this._ctx.state==='suspended')this._ctx.resume();return this._ctx;},
  _sfxOn(){return!S.settings||S.settings.sfx!==false;},
  _tone(freq,type,vol,attack,decay,start){
    if(!this._sfxOn())return;start=start||0;
    try{const ctx=this._get(),t=ctx.currentTime+start;
    const o=ctx.createOscillator(),g=ctx.createGain(),lp=ctx.createBiquadFilter();
    lp.type='lowpass';lp.frequency.value=2400;o.connect(lp);lp.connect(g);g.connect(ctx.destination);
    o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(0.0001,t+attack+decay);
    o.start(t);o.stop(t+attack+decay+0.05);}catch(e){}
  },
  _click(freq,vol,dur,start){
    if(!this._sfxOn())return;start=start||0;
    try{const ctx=this._get(),t=ctx.currentTime+start;
    const buf=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*dur),ctx.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const src=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();
    f.type='bandpass';f.frequency.value=freq;f.Q.value=1.2;
    src.buffer=buf;src.connect(f);f.connect(g);g.connect(ctx.destination);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.start(t);src.stop(t+dur+0.02);}catch(e){}
  },
  select(){this._click(600,0.12,0.055);this._tone(320,'sine',0.06,0.004,0.07);},
  commit(){this._click(600,0.12,0.055);this._tone(320,'sine',0.06,0.004,0.07);},
  coins(){this._tone(660,'sine',0.05,0.003,0.07);this._click(1100,0.03,0.03,0.02);},
  coinLand(){/* big coin lands — metallic thud + ring */
    this._click(400,0.12,0.06);this._tone(880,'sine',0.06,0.003,0.12);this._tone(1320,'sine',0.03,0.002,0.08,0.02);
  },
  coinExplode(){/* coin shatters — burst of metallic clinks */
    for(let i=0;i<6;i++){const t=i*0.04;this._click(800+Math.random()*600,0.05,0.04,t);this._tone(600+Math.random()*800,'sine',0.03,0.002,0.06,t);}
    this._click(300,0.1,0.08);
  },
  coinScatter(n){/* scattered coin clinks — more for higher amounts */
    const count=Math.min(n||4,8);
    for(let i=0;i<count;i++){const t=0.05+i*0.06+Math.random()*0.03;this._click(900+Math.random()*500,0.03,0.03,t);this._tone(700+Math.random()*600,'sine',0.02,0.002,0.04,t);}
  },
  roll(n){for(let i=0;i<Math.min(n||6,6);i++){this._click(800+Math.random()*400,0.06,0.04,i*0.04);this._tone(200+Math.random()*100,'triangle',0.03,0.003,0.05,i*0.04);}},
  bank(){this._tone(520,'sine',0.07,0.005,0.08);this._tone(660,'sine',0.05,0.004,0.10,0.06);this._click(900,0.04,0.04,0.01);},
  bust(){this._click(200,0.18,0.12);this._tone(160,'sine',0.1,0.005,0.18);this._tone(120,'sine',0.07,0.005,0.22,0.1);},
  hotDice(){/* epic rewarding trumpet */
    const notes=[[262,0],[330,0.1],[392,0.2],[494,0.32],[524,0.44],[659,0.56]];
    notes.forEach(([f,t])=>{this._tone(f,'triangle',0.06,0.015,0.3,t);this._tone(f*1.5,'sine',0.03,0.01,0.2,t);this._tone(f*2,'sine',0.015,0.008,0.15,t);});
    this._click(1400,0.025,0.05,0.1);this._click(1600,0.02,0.04,0.4);this._click(1800,0.015,0.03,0.6);
  },
  perfectStraight(){/* subtle pleasant trumpet */
    const notes=[[330,0],[392,0.08],[494,0.16],[524,0.26],[659,0.36]];
    notes.forEach(([f,t])=>{this._tone(f,'triangle',0.04,0.012,0.22,t);this._tone(f*1.5,'sine',0.02,0.008,0.15,t);});
    this._click(1400,0.018,0.04,0.08);
  },
  angelChoir(){/* massive 8-bit angelic choir */
    /* bass drone */
    this._tone(131,'sine',0.05,0.04,0.8,0);this._tone(262,'sine',0.04,0.035,0.7,0);
    /* main choir chord — C E G with detuning for width */
    const voices=[[523,0],[526,0],[659,0.04],[662,0.04],[784,0.08],[787,0.08]];
    voices.forEach(([f,t])=>{this._tone(f,'sine',0.05,0.035,0.6,t);this._tone(f*2,'sine',0.02,0.03,0.45,t);});
    /* high octave bloom */
    this._tone(1047,'sine',0.025,0.05,0.5,0.15);this._tone(1050,'sine',0.025,0.05,0.5,0.15);
    this._tone(1319,'sine',0.015,0.06,0.4,0.22);this._tone(1322,'sine',0.015,0.06,0.4,0.22);
    /* second swell — delayed repeat for sustain */
    const swell=[[523,0.3],[526,0.3],[659,0.34],[662,0.34],[784,0.38],[787,0.38]];
    swell.forEach(([f,t])=>{this._tone(f,'sine',0.04,0.04,0.55,t);this._tone(f*2,'sine',0.015,0.035,0.4,t);});
    /* shimmer */
    this._click(2000,0.02,0.06,0.1);this._click(2400,0.015,0.05,0.35);
  },
  cardFlip(){this._click(1200,0.06,0.04);this._tone(380,'sine',0.04,0.004,0.08,0.02);},
  cardTrigger(){this._tone(540,'sine',0.05,0.005,0.12);this._tone(810,'sine',0.03,0.003,0.09,0.03);this._click(1400,0.025,0.03,0.01);},
  nav(){this._click(800,0.05,0.03);this._tone(500,'sine',0.03,0.003,0.04);},
  win(){[[392,0],[494,0.12],[587,0.22],[784,0.34],[987,0.46]].forEach(([f,t])=>{this._tone(f,'sine',0.12,0.008,0.2,t);this._tone(f*1.5,'sine',0.04,0.005,0.12,t);});},
  lose(){[330,294,261,220].forEach((f,i)=>this._tone(f,'sine',0.09,0.008,0.22,i*0.16));},
  err(){this._click(300,0.08,0.05);this._tone(200,'sine',0.05,0.005,0.08);},
  combo(n){n=Math.min(n||3,6);const notes=[440,523,587,659,784,880];for(let i=0;i<n;i++){this._tone(notes[i],'sine',0.045,0.004,0.09,i*0.065);this._click(1200,0.015,0.015,i*0.065);}},
};

/* ═══════ SCORING ═══════ */
function scoreRoll(vals,cards,locked,context){
  cards=cards||[];locked=locked||0;context=context||{};
  const n=vals.length,used=new Array(n).fill(false);let pts=0;
  const copperPincher=cards.includes('copper_pincher'),millersToll=cards.includes('millers_toll'),scavenger=cards.includes('scavenger'),noSingles=cards.includes('_nosingles'),triplesPenalty=cards.includes('_triplepenalty');
  const cnt=f=>{let c=0;for(let i=0;i<n;i++)if(!used[i]&&vals[i]===f)c++;return c};
  const mark=(f,k)=>{let l=k;for(let i=0;i<n&&l>0;i++)if(!used[i]&&vals[i]===f){used[i]=true;l--;}};
  const hasSet=faces=>{const pool=vals.filter((_,i)=>!used[i]);return faces.every(f=>{const j=pool.indexOf(f);if(j<0)return false;pool.splice(j,1);return true;});};
  const markSet=faces=>{const todo=[...faces];for(let i=0;i<n&&todo.length;i++)if(!used[i]){const j=todo.indexOf(vals[i]);if(j>=0){used[i]=true;todo.splice(j,1);}}};
  let scavengerFired=false;
  if(scavenger&&!context._scavengerBlocked){
    const ones=vals.filter(v=>v===1).length,fives=vals.filter(v=>v===5).length;
    if(ones===1&&fives===1){pts+=300;mark(1,1);mark(5,1);scavengerFired=true;}
  }
  if(!scavengerFired){
    if(n>=6&&hasSet([1,2,3,4,5,6])){
      if(context.crowsLuck&&!context.crowsLuckUsed){context.crowsLuckUsed=true;pts+=750;markSet([2,3,4,5,6]);return{total:pts,used,context};}
      pts+=1500;used.fill(true);return{total:pts,used,context};
    }
    if(hasSet([2,3,4,5,6])){pts+=750;markSet([2,3,4,5,6]);}
    else if(hasSet([1,2,3,4,5])){pts+=500;markSet([1,2,3,4,5]);}
  }
  for(let f=1;f<=6;f++){const c=cnt(f);if(c>=3){let base=f===1?1000:f*100;for(let x=0;x<c-3;x++)base*=2;if(millersToll&&f>=2&&f<=4)base+=150;if(triplesPenalty&&f>=2)base=Math.max(0,base-50);pts+=base;mark(f,c);}}
  for(let i=0;i<n;i++){if(used[i])continue;const v=vals[i];if(v===1){if(!noSingles)pts+=millersToll?75:100;used[i]=true;}else if(v===5){if(!noSingles)pts+=copperPincher?75:50;used[i]=true;}}
  return{total:pts,used,context};
}
function scoreSelection(selVals,cards,locked,context){if(!selVals.length)return 0;const{total,used}=scoreRoll(selVals,cards,locked,context);if(used.some(u=>!u))return-1;return total;}
function anyScoring(vals,cards){return scoreRoll(vals,cards||[]).total>0;}
function isCombo(vals){if(vals.length<3)return false;const cnt={};vals.forEach(v=>cnt[v]=(cnt[v]||0)+1);if(Object.values(cnt).some(c=>c>=3))return true;const u=[...new Set(vals)].sort((a,b)=>a-b).join(',');return u==='1,2,3,4,5'||u==='2,3,4,5,6'||u==='1,2,3,4,5,6';}
function rollFace(mat,biasOverride){const dt=DICE_TYPES.find(d=>d.id===mat)||DICE_TYPES[0];const bias=biasOverride||dt.bias;let r=Math.random()*bias.reduce((a,v)=>a+v,0);for(let i=0;i<bias.length;i++){r-=bias[i];if(r<=0)return i+1;}return 6;}
function rollFaceSpur(mat){const dt=DICE_TYPES.find(d=>d.id===mat)||DICE_TYPES[0];const b=[...dt.bias];b[0]=Math.min(b[0]*2.5,b[0]+3);b[4]=Math.min(b[4]*2,b[4]+2);return rollFace(mat,b);}

/* ═══════ DICE RENDERER ═══════ */
function mkDie(val,mat,sizeClass){
  const div=document.createElement('div');
  div.className='die dtype-'+(mat||'bone')+(sizeClass?' '+sizeClass:'');
  const dotCells=FACE_DOTS[val]||FACE_DOTS[1];
  for(let i=0;i<49;i++){
    const cell=document.createElement('div');
    cell.className=dotCells.includes(i)?'dc dot':'dc';
    div.appendChild(cell);
  }
  return div;
}
function reDrawDieFace(d){
  const dotCells=FACE_DOTS[d.val]||FACE_DOTS[1];const cells=d.el.children;
  for(let i=0;i<49;i++){const cell=cells[i];if(!cell)continue;
    cell.className=dotCells.includes(i)?'dc dot':'dc';
  }
}
function settleDie(el){
  // Use Web Animations API for precise angle — no matrix decomposition
  const anims=el.getAnimations();
  let deg=0;
  if(anims.length){
    const a=anims[0];
    const t=a.currentTime%400; // 400ms period (dRoll .4s)
    deg=(t/400)*360;
    // commitStyles freezes current visual as inline style — zero visual change
    try{a.commitStyles();}catch(e){}
    a.cancel();
  }
  el.classList.remove('rolling');
  el.style.animation='none';
  el.style.transition='none';
  el.style.boxShadow='none';
  // Settle: always complete to next full 360° so reset to 0° is seamless
  // Bezier slope at t=0 = 0.5/0.5 = 1 → durMs = remaining/0.9 for speed match
  const remaining=(360-deg%360)%360||360;
  const durMs=Math.max(60,remaining/0.9);
  const settle=el.animate([
    {transform:'rotate('+deg.toFixed(2)+'deg)',boxShadow:'none'},
    {transform:'rotate('+(deg+remaining).toFixed(2)+'deg)',boxShadow:'3px 4px 0 rgba(30,18,8,.45),4px 5px 0 rgba(30,18,8,.2)'}
  ],{duration:durMs,easing:'cubic-bezier(0.5,0.5,0.65,1)',fill:'forwards'});
  settle.onfinish=function(){settle.cancel();el.style.transform='';el.style.boxShadow='';el.style.animation='';};
}

function toTitleCase(s){return s.toLowerCase().replace(/(?:^|\s|')\w/g,m=>m.toUpperCase());}
function gcCorners(){
  const corner=pos=>`<svg class="gc ${pos}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22"><rect x="0" y="0" width="3" height="16" rx="1" fill="currentColor"/><rect x="0" y="0" width="16" height="3" rx="1" fill="currentColor"/><rect x="14" y="-1" width="3" height="5" rx="1" fill="currentColor"/><rect x="-1" y="14" width="5" height="3" rx="1" fill="currentColor"/><polygon points="5,1 9,5 5,9 1,5" fill="currentColor"/></svg>`;
  return['tl','tr','bl','br'].map(corner).join('');
}
function mkChipHTML(c){
  return`<div class="cchip-inner rarity-${c.rarity}"><div class="cchip-front rarity-${c.rarity}"><div class="chip-icon">${c.icon}</div><div class="chip-gem"></div></div><div class="cchip-back rarity-${c.rarity}"><div class="gcard"><div class="gcard-frame"></div>${gcCorners()}<div class="gcard-pip"></div><div class="gcard-icon">${c.icon}</div><div class="gcard-rule"></div><div class="gcard-name">${c.name}</div><div class="gcard-eff">${c.eff}</div><div class="gcard-band">${c.rarity.toUpperCase()}</div></div></div></div>`;
}
function buildCBar(barId,cardIds,isOpp,label){
  const bar=document.getElementById(barId);bar.querySelectorAll('.mcard,.cchip').forEach(e=>e.remove());
  const n=cardIds.length;if(!n)return;
  const spread=Math.min(56,220/n);/* px between card centers */
  const totalW=spread*(n-1);
  cardIds.forEach((id,i)=>{const c=CARDS.find(x=>x.id===id);if(!c)return;
    const isActive=c.type==='active';
    const w=document.createElement('div');w.className='mcard rarity-'+c.rarity+(isActive?' mcard-active':'');w.dataset.cid=id;
    w.innerHTML=
      '<div class="gcard rarity-'+c.rarity+'">'+
        '<img src="Card_ART/Flintlock_face.png" class="gcard-art" alt="'+c.name+'">'+
        '<div class="gcard-frame"></div>'+gcCorners()+
      '</div>'+
      '<div class="mcard-tooltip rarity-'+c.rarity+'">'+
        gcCorners()+
        '<div class="tip-name">'+c.name+'</div>'+
        '<div class="tip-eff">'+c.eff+'</div>'+
        '<div class="tip-band">'+c.rarity.toUpperCase()+'</div>'+
      '</div>';
    /* fan positioning */
    const t=(n===1)?0:(i/(n-1))*2-1;
    const rot=(isOpp?-1:1)*t*8;
    const cx=50+(t*totalW/2)/3.75;
    const lift=(1-t*t)*8;/* parabolic: 8px at center, 0px at edges */
    w.style.setProperty('--rot',rot+'deg');
    w.style.setProperty('--cx',cx+'%');
    w.style.setProperty('--lift',lift+'px');
    w.style.zIndex=10+i;
    if(isActive&&!isOpp){
      const tap=e=>{e.stopPropagation();openActiveCardZoom(id);};
      w.addEventListener('click',tap);w.addEventListener('touchend',e=>{e.preventDefault();tap(e);},{passive:false});
    }else{
      const toggle=e=>{e.stopPropagation();SFX.cardFlip();
        const wasPeeked=w.classList.contains('peeked');closeAllChips();
        if(!wasPeeked){w.classList.add('peeked');}
      };
      w.addEventListener('click',toggle);w.addEventListener('touchend',e=>{e.preventDefault();toggle(e);},{passive:false});
    }
    bar.appendChild(w);});
}
function closeAllChips(){document.querySelectorAll('.mcard.peeked,.cchip.open').forEach(c=>{c.classList.remove('peeked');c.classList.remove('open');});}
