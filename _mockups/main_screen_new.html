<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fark — Main Screen (painted mockup)</title>
<style>
@font-face{font-family:'Deutsch Gothic';src:url('new_main/Deutsch.ttf') format('truetype')}
@font-face{font-family:'Britannia';src:url('new_main/Britannia.otf') format('opentype')}
@font-face{font-family:'Chalk Paint';src:url('new_main/ChalkPaint.ttf') format('truetype')}
@font-face{font-family:'Schwabacher';src:url('new_main/Hamburger_Schwabacher.ttf') format('truetype')}
@font-face{font-family:'Requiem';src:url('new_main/Requiem for A.ttf') format('truetype')}
@font-face{font-family:'Old Englished Boots';src:url('new_main/Old_Englished_Boots.ttf') format('truetype')}
@font-face{font-family:'Black Castle';src:url('new_main/BlackCastleMF.ttf') format('truetype')}
@font-face{font-family:'Gothica';src:url('new_main/gothica class 2.ttf') format('truetype')}
@font-face{font-family:'JMH Beda';src:url('new_main/JMH Beda.ttf') format('truetype')}
@font-face{font-family:'Pirata One';src:url('new_main/PirataOne-Regular.ttf') format('truetype')}
@font-face{font-family:'Seagram';src:url('new_main/Seagram tfb.ttf') format('truetype')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a0806;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}

/* ── the stage: a 9:16 canvas, everything positioned in % of it ── */
#stage{position:relative;height:100vh;aspect-ratio:9/16;max-width:100vw;overflow:hidden;
  background:#0a0806;--u:1vh;--bodyFont:'JMH Beda',serif}
#stage>img.env{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
#bgL{z-index:0;transition:filter .45s}
#fgL{z-index:1;transform-origin:50% 92%;transition:transform .5s cubic-bezier(.4,0,.25,1),filter .45s}
#stage.panel-open #fgL{transform:translateY(2.5%) scale(1.04)}
#cards{position:absolute;inset:0;transition:filter .45s}
#hearts,#goldplate{transition:filter .45s}
#stage.panel-open #bgL,#stage.panel-open #fgL,#stage.panel-open #cards,
#stage.panel-open #hearts,#stage.panel-open #goldplate{filter:blur(6px) brightness(.55)}

/* ── patron cards: separated layers with per-layer parallax.
   The outer .card owns position + static z-rotation + the entry wave;
   .cwrap layers consume --wx/--wy (driven by JS) scaled by --f so the
   chrome leads and the backdrop lags — a little depth per card. ── */
.card{position:absolute;width:23%;aspect-ratio:443/802;z-index:3;cursor:pointer;will-change:transform;
  transform:rotate(var(--rot,0deg));
  transition:filter .12s,transform .55s cubic-bezier(.3,1.15,.35,1)}
.card:active{filter:brightness(1.12)}
.card.enter{animation:cardIn .72s cubic-bezier(.3,1.18,.36,1) var(--d,0s) both}
@keyframes cardIn{
  from{transform:translate3d(0,118%,0) rotate(var(--rot,0deg))}
  to{transform:translate3d(0,0,0) rotate(var(--rot,0deg))}}
/* tap: the picked card glides to the panel's crown; the rest drop out */
.card.drag{z-index:7;transition:filter .12s;cursor:grabbing}
.card.home{transition:filter .12s,transform .55s cubic-bezier(.3,1.3,.36,1)}
.card.drop{transition:transform .5s cubic-bezier(.55,.06,.75,.4) var(--dd,0s);
  transform:translate3d(0,170%,0) rotate(var(--rot,0deg))}
.card .ly{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  pointer-events:none;will-change:transform}
.card .lfront{position:absolute;inset:0;pointer-events:none;will-change:transform}
.card .lfront .lffg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
.card .ctext{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.card .cseal{position:absolute;right:4.3%;top:77.7%;width:32.4%;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.4));transform:rotate(6deg)}
.c1{left:4.1%;top:62%;--rot:-3.5deg;--d:.05s}
.c2{left:27.1%;top:63%;--rot:-1deg;--d:.16s}
.c3{left:50.8%;top:62.5%;--rot:1.4deg;--d:.27s}
.c4{left:73.9%;top:63.4%;--rot:3.6deg;--d:.38s}
@media (prefers-reduced-motion:reduce){.card.enter{animation:none}}

/* ── top chips (kept from the previous version) ── */
#hearts{position:absolute;left:3.6%;top:1.8%;z-index:8;display:flex;gap:3.5%;width:27%}
#hearts img{width:30%;filter:drop-shadow(0 3px 5px rgba(0,0,0,.55))}
#goldplate{position:absolute;right:3.2%;top:1.8%;width:27.5%;z-index:8}
#goldplate .pl{width:100%;display:block;filter:drop-shadow(0 3px 6px rgba(0,0,0,.55))}
#goldplate .co{position:absolute;left:6.5%;top:50%;width:17.5%;transform:translateY(-50%);
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
#goldplate .amt{position:absolute;left:26%;right:8%;top:0;bottom:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--bodyFont);font-size:calc(var(--u)*2.8);color:#f3dfa6;letter-spacing:1px;
  text-shadow:0 2px 3px rgba(0,0,0,.7)}

/* ── character panel: full-screen per-class sheet (Commoner art for now).
   Portrait, name and row labels are baked in; we overlay the three values,
   the band line, and the SIT DOWN / close buttons (more layers to come
   for click animations). ── */
#scrim{position:absolute;inset:0;background:rgba(6,4,2,.5);opacity:0;pointer-events:none;
  transition:opacity .28s;z-index:9}
#scrim.on{opacity:1;pointer-events:auto}
#panel{position:absolute;inset:0;z-index:10;transform:translateY(103%);pointer-events:none;
  transition:transform .5s cubic-bezier(.3,1,.3,1)}
#panel.on{transform:translateY(0);pointer-events:auto}
#panel .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pv{position:absolute;right:14%;font-family:var(--bodyFont);color:#2e1c0b;
  font-size:calc(var(--u)*3.9);text-align:right}
#pvTarget{bottom:37.8%}
#pvStake{bottom:28.4%}
#pvPot{bottom:19.5%}
#pvBand{position:absolute;left:12%;right:12%;top:43.2%;height:10.4%;
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-family:var(--bodyFont);font-size:calc(var(--u)*2.2);color:#e6d9bc}
#panel .pbtn{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  pointer-events:none;transition:transform .1s}
#sitLayer{transform-origin:49.7% 88%}
#closeLayer{transform-origin:89.5% 92.4%}
#btnSit,#btnClose{position:absolute;cursor:pointer}
#btnSit{left:17%;top:82%;width:65%;height:10%}
#btnClose{left:79%;top:87.5%;width:16%;height:10%}
#btnSit:active ~ #sitLayer{transform:scale(.955)}
#btnClose:active ~ #closeLayer{transform:scale(.9) rotate(-5deg)}

/* mockup-only: body-font audition chip */
#fontChip{position:absolute;left:2.5%;bottom:1.6%;z-index:12;cursor:pointer;
  font-family:var(--bodyFont);font-size:calc(var(--u)*1.7);color:rgba(240,224,190,.85);
  background:rgba(12,8,5,.62);border:1px solid rgba(160,130,90,.4);border-radius:5px;
  padding:.6% 1.6%;user-select:none}
</style>
</head>
<body>
<div id="stage">
  <img class="env" id="bgL" src="new_main/bg3.png" alt="">
  <img class="env" id="fgL" src="new_main/fg3.png" alt="">

  <div id="cards"></div>

  <!-- character panel -->
  <div id="scrim" onclick="closePanel()"></div>
  <div id="panel">
    <img class="bgimg" id="pnArt" src="new_main/panel_krox.png" alt="">
    <div id="pvBand"></div>
    <span class="pv" id="pvTarget"></span>
    <span class="pv" id="pvStake"></span>
    <span class="pv" id="pvPot"></span>
    <div id="btnSit" onclick="closePanel()"></div>
    <div id="btnClose" onclick="closePanel()"></div>
    <img class="pbtn" id="sitLayer" src="new_main/btn_sit_full.png" alt="">
    <img class="pbtn" id="closeLayer" src="new_main/btn_close_full.png" alt="">
  </div>

  <!-- top chips -->
  <div id="hearts">
    <img src="new_main/heart_full.png" alt=""><img src="new_main/heart_full.png" alt=""><img src="new_main/heart_full.png" alt="">
  </div>
  <div id="goldplate">
    <img class="pl" src="new_main/plate_goldCounter.png" alt="">
    <img class="co" src="new_main/coin.png" alt="">
    <div class="amt">120g</div>
  </div>
  <div id="fontChip" onclick="cycleFont()">Aa</div>
</div>

<script>
/* colors are bound to the frame; traits always wear the frame's color;
   characters can sit in any frame. Double-click a card to demo GONE HOME. */
var SEATS=[
  {key:'krox', name:'Krox', color:'green', trait:'Strong', price:15, target:'3,000', pot:'+40g', dice:6, gone:false},
  {key:'eira', name:'Eira', color:'purple',trait:'Cunning',price:20, target:'2,600', pot:'+55g', dice:6, gone:false},
  {key:'nebb', name:'Nebb', color:'blue',  trait:'Lucky',  price:10, target:'2,200', pot:'+30g', dice:5, gone:false},
  {key:'regis',name:'Regis',color:'red',   trait:'Greedy', price:25, target:'3,400', pot:'+70g', dice:7, gone:false}
];

function renderCards(){
  var host=document.getElementById('cards');host.innerHTML='';
  SEATS.forEach(function(st,i){
    var d=document.createElement('div');
    d.className='card c'+(i+1)+' enter';
    d.innerHTML=
      '<div class="cwrap">'+
      '<img class="ly lbg" src="new_main/card_'+st.color+'_bg.png" alt="">'+
      '<img class="ly lback" src="new_main/card_'+st.color+'_back.png" alt="">'+
      '<img class="ly lwho" src="new_main/who_'+(st.gone?'gonehome':st.key)+'.png" alt="">'+
      '<div class="lfront">'+
        '<img class="lffg" src="new_main/card_'+st.color+'_fg.png" alt="">'+
        '<canvas class="ctext"></canvas>'+
        '<img class="cseal" src="new_main/'+st.trait+'_'+st.color+'.png" alt="">'+
      '</div>'+
      '</div>';
    d.onclick=function(){if(d._sup){d._sup=false;return;}if(!st.gone)selectCard(st,d);};
    d.ondblclick=function(e){e.preventDefault();st.gone=!st.gone;renderCards();};
    host.appendChild(d);
    d._layers={lbg:d.querySelector('.lbg'),lback:d.querySelector('.lback'),
      lwho:d.querySelector('.lwho'),lfront:d.querySelector('.lfront')};
    d._seat=st;drawCardText(d);
  });
}

/* names + prices are painted into a bitmap so they glide subpixel-smooth
   in every browser (Firefox pixel-snaps live glyphs vertically) */
function _bodyFontName(){return (localStorage.bodyFont||'JMH Beda');}
function drawCardText(card){
  var st=card._seat,cv=card.querySelector('.ctext');if(!st||!cv)return;
  var w=card.offsetWidth,h=card.offsetHeight;if(!w)return;
  var dpr=window.devicePixelRatio||1,u=innerHeight/100;
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  var x=cv.getContext('2d');x.scale(dpr,dpr);
  var fam='"'+_bodyFontName()+'",serif';
  x.fillStyle='#3a2712';x.textAlign='center';x.textBaseline='middle';
  x.font=(u*2.4)+'px '+fam;
  x.fillText(st.name,w/2,h*.672);
  x.fillStyle='#2e1c0b';x.textAlign='left';
  x.font=(u*2.5)+'px '+fam;
  x.fillText(st.price,w*.45,h*.802);
}
function redrawAllCardText(){document.querySelectorAll('.card').forEach(drawCardText);}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(redrawAllCardText);
addEventListener('resize',redrawAllCardText);

/* entry wave replay = re-entering the room (also dblclick the scene) */
function replayWave(){
  document.querySelectorAll('.card').forEach(function(c){
    c.classList.remove('enter');void c.offsetWidth;c.classList.add('enter');
  });
}
document.getElementById('fgL');
document.getElementById('stage').addEventListener('dblclick',function(e){
  if(!e.target.closest('.card')&&!e.target.closest('#panel'))replayWave();
});

/* wiggle + parallax: one rAF loop drives --wx/--wy per card; layers scale
   the motion by --f so the chrome floats over the backdrop. Pointer adds a
   soft parallax lean. */
var REDUCED=matchMedia('(prefers-reduced-motion:reduce)').matches;
/* drag toy: grab a card, sling it around, let go — it floats home.
   dragX/Y is where the card IS; lagX/Y is where its inner layers THINK
   they are (a lazy spring), so the layers trail the chrome while you
   drag and settle with a soft wobble after release. */
var dragX=[0,0,0,0],dragY=[0,0,0,0],lagX=[0,0,0,0],lagY=[0,0,0,0],rel=[false,false,false,false];
/* depth factors: backdrop lags low (and can barely rise — its paint edge
   shows), character tracks the chrome closely, chrome leads a touch */
function loop(t){
  document.querySelectorAll('.card').forEach(function(c,i){
    var L=c._layers;if(!L)return;
    var ph=i*1.9,s=t/1000;
    if(rel[i]){dragX[i]*=.8;dragY[i]*=.8;
      if(Math.abs(dragX[i])+Math.abs(dragY[i])<.5){dragX[i]=0;dragY[i]=0;rel[i]=false;}}
    lagY[i]+=(dragY[i]-lagY[i])*.12;
    var ry=Math.max(-14,Math.min(14,(lagY[i]-dragY[i])*.55));
    var wy=Math.cos(s*.7+ph*1.3)*1.4+Math.sin(s*1.3+ph)*.7+ry;
    /* the .02deg keeps Firefox from pixel-snapping the text layer
       (snapped = 1px steps = the low-framerate look) */
    L.lbg.style.transform='translate3d(0,'+Math.max(wy*.35,-3).toFixed(2)+'px,0)';
    L.lback.style.transform='translate3d(0,'+Math.max(wy*.5,-4).toFixed(2)+'px,0)';
    L.lwho.style.transform='translate3d(0,'+(wy*.92).toFixed(2)+'px,0) rotate(.02deg)';
    L.lfront.style.transform='translate3d(0,'+(wy*1.06).toFixed(2)+'px,0) rotate(.02deg)';
  });
  requestAnimationFrame(loop);
}
if(!REDUCED)requestAnimationFrame(loop);
var _dg={el:null,i:-1,x0:0,y0:0,rot:0,moved:false};
document.addEventListener('pointerdown',function(e){
  var el=e.target.closest('.card');
  if(!el||_open||el.classList.contains('drop'))return;
  _dg.el=el;_dg.i=[].indexOf.call(el.parentNode.children,el);rel[_dg.i]=false;
  _dg.x0=e.clientX;_dg.y0=e.clientY;_dg.moved=false;
  _dg.rot=parseFloat(getComputedStyle(el).getPropertyValue('--rot'))||0;
  el.classList.remove('enter');el.classList.add('drag');
  el.setPointerCapture(e.pointerId);
});
document.addEventListener('pointermove',function(e){
  if(!_dg.el)return;
  var dx=e.clientX-_dg.x0,dy=e.clientY-_dg.y0;
  if(Math.abs(dx)+Math.abs(dy)>7)_dg.moved=true;
  dragX[_dg.i]=dx;dragY[_dg.i]=dy;
  var tilt=Math.max(-9,Math.min(9,dx*.045));
  _dg.el.style.transform='translate3d('+dx.toFixed(1)+'px,'+dy.toFixed(1)+'px,0) rotate('+(_dg.rot+tilt).toFixed(2)+'deg)';
});
document.addEventListener('pointerup',function(e){
  if(!_dg.el)return;
  var el=_dg.el,i=_dg.i,moved=_dg.moved;_dg.el=null;
  el.classList.remove('drag');el.classList.add('home');
  el.style.transform='';           /* eases straight home, no overshoot */
  el.addEventListener('transitionend',function h(e){
    if(e.propertyName!=='transform')return;
    el.classList.remove('home');el.removeEventListener('transitionend',h);
  });
  rel[i]=true;                     /* drag offset decays smoothly in the loop */
  if(moved)el._sup=true;           /* a drag is not a tap */
});
/* the entry animation hands control back to transitions once it lands */
document.addEventListener('animationend',function(e){
  if(e.target.classList&&e.target.classList.contains('card'))e.target.classList.remove('enter');
});

/* tap a card: the whole row drops away and the character sheet rises */
var _open=false;
function selectCard(st,el){
  if(_open)return;_open=true;
  document.querySelectorAll('.card').forEach(function(c,i){
    c.classList.remove('enter');
    c.style.setProperty('--dd',(i*0.05)+'s');
    c.classList.add('drop');
  });
  document.getElementById('stage').classList.add('panel-open');
  setTimeout(function(){openPanel(st);},150);
}
/* panel */
function openPanel(st){
  document.getElementById('pnArt').src='new_main/'+(st.panel||'panel_krox')+'.png';
  document.getElementById('pvBand').textContent=st.trait+' · rolls '+st.dice+' dice';
  document.getElementById('pvTarget').textContent=st.target;
  document.getElementById('pvStake').textContent=st.price+'g';
  document.getElementById('pvPot').textContent=st.pot;
  document.getElementById('scrim').classList.add('on');
  document.getElementById('panel').classList.add('on');
}
function closePanel(){
  document.getElementById('scrim').classList.remove('on');
  document.getElementById('panel').classList.remove('on');
  document.getElementById('stage').classList.remove('panel-open');
  _open=false;
  /* the crowd re-enters immediately, overlapping the unblur */
  document.querySelectorAll('.card').forEach(function(c){
    c.classList.remove('drop');c.classList.remove('enter');
    void c.offsetWidth;c.classList.add('enter');
  });
}

/* mockup-only: body-font audition */
var BODY_FONTS=['JMH Beda','Schwabacher','Requiem','Old Englished Boots','Black Castle','Gothica','Britannia','Pirata One','Seagram'];
function cycleFont(){
  var st=document.getElementById('stage');
  var cur=(localStorage.bodyFont||'JMH Beda');
  var nxt=BODY_FONTS[(BODY_FONTS.indexOf(cur)+1)%BODY_FONTS.length];
  localStorage.bodyFont=nxt;
  st.style.setProperty('--bodyFont',"'"+nxt+"',serif");
  document.fonts.load("20px '"+nxt+"'").then(redrawAllCardText);
  var chip=document.getElementById('fontChip');
  chip.textContent=nxt;
  clearTimeout(chip._t);chip._t=setTimeout(function(){chip.textContent='Aa';},1600);
}
localStorage.bodyFont='JMH Beda'; /* reset audition to the chosen default */

renderCards();
setTimeout(function(){document.querySelectorAll('.card.enter').forEach(function(c){c.classList.remove('enter');});},1400);
</script>
</body>
</html>
