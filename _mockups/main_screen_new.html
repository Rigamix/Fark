<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fark — Main Screen (painted mockup)</title>
<style>
@font-face{font-family:'Alagard';src:url('../Fonts/Pixel/alagard.ttf') format('truetype')}
@font-face{font-family:'Enchanted Land';src:url('../Fonts/Medieval/Enchanted Land.otf') format('opentype')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a0806;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}

/* ── the stage: a 9:16 canvas, everything positioned in % of it ── */
#stage{position:relative;height:100vh;aspect-ratio:9/16;max-width:100vw;overflow:hidden;background:#0a0806}
@supports not (aspect-ratio:1){#stage{width:56.25vh}}
#stage>img.env{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}

/* scene sandwich: bg → grog → table → foreground → boards → top chips */
#grog{position:absolute;left:26.5%;top:26.2%;width:49%;z-index:2;pointer-events:none;
  filter:drop-shadow(0 10px 24px rgba(0,0,0,.45))}
#tableL{z-index:3}
#fgL{z-index:4}

/* ── hanging chalkboards (2×2) ── */
.board{position:absolute;width:36.5%;aspect-ratio:100/127;z-index:5;cursor:pointer;transition:transform .09s}
.board:active{transform:scale(.975)}
.board .cord{position:absolute;left:0;top:-11.5%;width:100%;height:12%;overflow:visible}
.board .cord line{stroke:#0d0b09;stroke-width:6;stroke-linecap:round}
.board .cord circle{fill:#1a1512}
.board img.bd{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;filter:drop-shadow(0 12px 20px rgba(0,0,0,.5))}
.board .slate{position:absolute;left:11%;right:11%;top:9%;bottom:34%;display:flex;
  flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.board .strap{position:absolute;left:6%;right:6%;bottom:2.5%;height:17%;display:flex;
  align-items:center;justify-content:center;pointer-events:none;
  font-family:'Alagard',serif;font-size:calc(var(--u)*4.4);color:#4a3115;letter-spacing:1px}
.b1{left:15.4%;top:45.2%}
.b2{left:56.2%;top:45.2%}
.b3{left:15.4%;top:73.6%}
.b4{left:56.2%;top:73.6%}
.b3,.b4{z-index:5}

/* ── top chips ── */
#hearts{position:absolute;left:3.6%;top:1.8%;z-index:8;display:flex;gap:3.5%;width:27%}
#hearts img{width:30%;filter:drop-shadow(0 3px 5px rgba(0,0,0,.55))}
#goldplate{position:absolute;right:3.2%;top:1.8%;width:27.5%;z-index:8}
#goldplate .pl{width:100%;display:block;filter:drop-shadow(0 3px 6px rgba(0,0,0,.55))}
#goldplate .co{position:absolute;left:6.5%;top:50%;width:17.5%;transform:translateY(-50%);
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
#goldplate .amt{position:absolute;left:26%;right:8%;top:0;bottom:0;display:flex;align-items:center;justify-content:center;
  font-family:'Alagard',serif;font-size:calc(var(--u)*5.6);color:#f3dfa6;letter-spacing:1px;
  text-shadow:0 2px 3px rgba(0,0,0,.7)}

/* size unit: 1% of stage width, so type scales with the stage */
#stage{--u:1vh}
</style>
</head>
<body>
<div id="stage">
  <img class="env" id="bgL" src="new_main/bg.png" alt="">
  <img id="grog" src="new_main/grog.png" alt="">
  <img class="env" id="tableL" src="new_main/table.png" alt="">
  <img class="env" id="fgL" src="new_main/fg.png" alt="">

  <!-- four seats -->
  <div class="board b1">
    <svg class="cord" viewBox="0 0 100 26" preserveAspectRatio="none">
      <line x1="9" y1="26" x2="50" y2="3"/><line x1="91" y1="26" x2="50" y2="3"/><circle cx="50" cy="3" r="3.4"/></svg>
    <img class="bd" src="new_main/board_full.png" alt="">
    <div class="slate"></div><div class="strap"></div>
  </div>
  <div class="board b2">
    <svg class="cord" viewBox="0 0 100 26" preserveAspectRatio="none">
      <line x1="9" y1="26" x2="50" y2="3"/><line x1="91" y1="26" x2="50" y2="3"/><circle cx="50" cy="3" r="3.4"/></svg>
    <img class="bd" src="new_main/board_full.png" alt="">
    <div class="slate"></div><div class="strap"></div>
  </div>
  <div class="board b3">
    <svg class="cord" viewBox="0 0 100 26" preserveAspectRatio="none">
      <line x1="9" y1="26" x2="50" y2="3"/><line x1="91" y1="26" x2="50" y2="3"/><circle cx="50" cy="3" r="3.4"/></svg>
    <img class="bd" src="new_main/board_full.png" alt="">
    <div class="slate"></div><div class="strap"></div>
  </div>
  <div class="board b4">
    <svg class="cord" viewBox="0 0 100 26" preserveAspectRatio="none">
      <line x1="9" y1="26" x2="50" y2="3"/><line x1="91" y1="26" x2="50" y2="3"/><circle cx="50" cy="3" r="3.4"/></svg>
    <img class="bd" src="new_main/board_full.png" alt="">
    <div class="slate"></div><div class="strap"></div>
  </div>

  <!-- top chips -->
  <div id="hearts">
    <img src="new_main/heart_full.png" alt=""><img src="new_main/heart_full.png" alt=""><img src="new_main/heart_full.png" alt="">
  </div>
  <div id="goldplate">
    <img class="pl" src="new_main/plate_goldCounter.png" alt="">
    <img class="co" src="new_main/coin.png" alt="">
    <div class="amt">120g</div>
  </div>
</div>
</body>
</html>
