<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fark — Main Screen (painted mockup)</title>
<style>
@font-face{font-family:'Deutsch Gothic';src:url('new_main/Deutsch.ttf') format('truetype')}
@font-face{font-family:'Britannia';src:url('new_main/Britannia.otf') format('opentype')}
@font-face{font-family:'Chalk Paint';src:url('new_main/ChalkPaint.ttf') format('truetype')}
@font-face{font-family:'Schwabacher';src:url('new_main/Hamburger_Schwabacher.ttf') format('truetype')}
@font-face{font-family:'Requiem';src:url('new_main/Requiem for A.ttf') format('truetype')}
@font-face{font-family:'Old Englished Boots';src:url('new_main/Old_Englished_Boots.ttf') format('truetype')}
@font-face{font-family:'Black Castle';src:url('new_main/BlackCastleMF.ttf') format('truetype')}
@font-face{font-family:'Gothica';src:url('new_main/gothica class 2.ttf') format('truetype')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a0806;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}

/* ── the stage: a 9:16 canvas, everything positioned in % of it ── */
#stage{position:relative;height:100vh;aspect-ratio:9/16;max-width:100vw;overflow:hidden;
  background:#0a0806;--u:1vh;--bodyFont:'Schwabacher',serif}
#stage>img.env{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
#bgL{z-index:0}
#fgL{z-index:1}  /* the boss + his table live in this layer */

/* ── patron cards: separated layers with per-layer parallax.
   The outer .card owns position + static z-rotation + the entry wave;
   .cwrap layers consume --wx/--wy (driven by JS) scaled by --f so the
   chrome leads and the backdrop lags — a little depth per card. ── */
.card{position:absolute;width:24.5%;aspect-ratio:443/802;z-index:3;cursor:pointer;
  transform:rotate(var(--rot,0deg));transition:filter .12s}
.card:active{filter:brightness(1.12)}
.card.enter{animation:cardIn .85s cubic-bezier(.26,1.25,.42,1) var(--d,0s) both}
@keyframes cardIn{
  0%{transform:translateY(115%) rotate(var(--rot,0deg))}
  62%{transform:translateY(-3.2%) rotate(var(--rot,0deg))}
  82%{transform:translateY(1.4%) rotate(var(--rot,0deg))}
  100%{transform:translateY(0) rotate(var(--rot,0deg))}}
.card .ly{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  pointer-events:none;transform:translate(calc(var(--wx,0px)*var(--f)),calc(var(--wy,0px)*var(--f)))}
.card .lbg{--f:.35}
.card .lback{--f:.5}
.card .lwho{--f:.75}
.card .lffg{--f:1.1;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
.card .cname{position:absolute;left:12%;right:12%;top:63.5%;height:11%;
  display:flex;align-items:center;justify-content:center;pointer-events:none;
  font-family:var(--bodyFont);font-size:calc(var(--u)*2.4);color:#3a2712;letter-spacing:.5px;
  transform:translate(calc(var(--wx,0px)*1.1),calc(var(--wy,0px)*1.1))}
.card .cprice{position:absolute;left:34%;top:76.5%;height:9%;display:flex;align-items:center;
  pointer-events:none;font-family:var(--bodyFont);font-size:calc(var(--u)*2.5);color:#2e1c0b;
  transform:translate(calc(var(--wx,0px)*1.1),calc(var(--wy,0px)*1.1))}
.card .cseal{position:absolute;right:7%;top:74%;width:27%;pointer-events:none;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.4));
  transform:translate(calc(var(--wx,0px)*1.15),calc(var(--wy,0px)*1.15)) rotate(6deg)}
.c1{left:2.2%;top:61.8%;--rot:-3.5deg;--d:.05s}
.c2{left:26.6%;top:62.9%;--rot:-1deg;--d:.16s}
.c3{left:50.8%;top:62.3%;--rot:1.4deg;--d:.27s}
.c4{left:74.8%;top:63.3%;--rot:3.6deg;--d:.38s}
@media (prefers-reduced-motion:reduce){.card.enter{animation:none}}

/* ── top chips (kept from the previous version) ── */
#hearts{position:absolute;left:3.6%;top:1.8%;z-index:8;display:flex;gap:3.5%;width:27%}
#hearts img{width:30%;filter:drop-shadow(0 3px 5px rgba(0,0,0,.55))}
#goldplate{position:absolute;right:3.2%;top:1.8%;width:27.5%;z-index:8}
#goldplate .pl{width:100%;display:block;filter:drop-shadow(0 3px 6px rgba(0,0,0,.55))}
#goldplate .co{position:absolute;left:6.5%;top:50%;width:17.5%;transform:translateY(-50%);
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
#goldplate .amt{position:absolute;left:26%;right:8%;top:0;bottom:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--bodyFont);font-size:calc(var(--u)*2.8);color:#f3dfa6;letter-spacing:1px;
  text-shadow:0 2px 3px rgba(0,0,0,.7)}

/* ── patron panel (unchanged bones): engraved labels, painted values ── */
#scrim{position:absolute;inset:0;background:rgba(6,4,2,.5);opacity:0;pointer-events:none;
  transition:opacity .28s;z-index:9}
#scrim.on{opacity:1;pointer-events:auto}
#panel{position:absolute;left:50%;top:50%;height:88%;aspect-ratio:1477/2634;z-index:10;
  transform:translate(-50%,80%) scale(.98);opacity:0;pointer-events:none;
  transition:transform .34s cubic-bezier(.2,.9,.3,1),opacity .22s}
#panel.on{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
#panel .bgimg{position:absolute;inset:0;width:100%;height:100%;
  filter:drop-shadow(0 18px 40px rgba(0,0,0,.6))}
#panel .in{position:absolute;left:11%;right:11%;top:11.5%;bottom:16%;display:flex;
  flex-direction:column;align-items:center}
.engr{font-family:var(--bodyFont);color:#5b3a15;
  text-shadow:0 1px 0 rgba(255,242,205,.55),0 -1px 1px rgba(52,30,9,.4)}
.ink{font-family:var(--bodyFont);color:#2e1c0b}
#pnPortWrap{position:relative;width:50%;aspect-ratio:1/1;margin-top:1%;overflow:hidden;
  border:2px solid rgba(90,58,26,.55);border-radius:4px;
  box-shadow:inset 0 0 12px rgba(0,0,0,.25),0 4px 8px rgba(60,35,10,.25)}
#pnPortWrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
#pnName{margin-top:3.5%;font-family:'Deutsch Gothic',serif;font-size:calc(var(--u)*3);letter-spacing:1px;color:#5b3a15;
  text-shadow:0 1px 0 rgba(255,242,205,.55),0 -1px 1px rgba(52,30,9,.4)}
#pnTraitRow{display:flex;align-items:center;gap:6%;margin-top:2.5%}
#pnTraitRow img{width:calc(var(--u)*4.2);filter:drop-shadow(0 2px 2px rgba(60,35,10,.35))}
#pnTrait{font-size:calc(var(--u)*1.9)}
#pnDice{display:flex;gap:5%;margin-top:4%;width:70%;justify-content:center}
#pnDice .pd{width:12%;aspect-ratio:1;background:#ece0c4;border:1.5px solid #6a4a22;border-radius:18%;
  box-shadow:inset 0 -2px 3px rgba(96,64,28,.35),0 2px 3px rgba(60,35,10,.3);position:relative}
#pnDice .pd::after{content:'';position:absolute;left:50%;top:50%;width:26%;height:26%;
  transform:translate(-50%,-50%);border-radius:50%;background:#4a3115}
#pnStats{display:flex;justify-content:space-between;width:96%;margin-top:6%}
#pnStats .st{display:flex;flex-direction:column;align-items:center;gap:4px}
#pnStats .lb{font-size:calc(var(--u)*1.15);letter-spacing:2px}
#pnStats .vl{font-size:calc(var(--u)*2.1);display:flex;align-items:center;gap:4px}
#pnStats .vl img{width:calc(var(--u)*1.7)}
#pnSit{margin-top:auto;margin-bottom:1%;width:74%;padding:4.5% 0;text-align:center;cursor:pointer;
  font-family:'Deutsch Gothic',serif;font-size:calc(var(--u)*2.2);letter-spacing:2px;color:#f3dfa6;
  background:linear-gradient(180deg,#8e2f26 0%,#71241d 55%,#5e1d18 100%);
  border:2px solid #b98a3e;border-radius:6px;
  box-shadow:0 3px 6px rgba(20,10,5,.45),inset 0 1px 0 rgba(255,220,160,.25);
  text-shadow:0 2px 3px rgba(30,10,5,.6);transition:transform .08s}
#pnSit:active{transform:scale(.96)}

/* mockup-only: body-font audition chip */
#fontChip{position:absolute;left:2.5%;bottom:1.6%;z-index:12;cursor:pointer;
  font-family:var(--bodyFont);font-size:calc(var(--u)*1.7);color:rgba(240,224,190,.85);
  background:rgba(12,8,5,.62);border:1px solid rgba(160,130,90,.4);border-radius:5px;
  padding:.6% 1.6%;user-select:none}
</style>
</head>
<body>
<div id="stage">
  <img class="env" id="bgL" src="new_main/bg3.png" alt="">
  <img class="env" id="fgL" src="new_main/fg3.png" alt="">

  <div id="cards"></div>

  <!-- patron panel -->
  <div id="scrim" onclick="closePanel()"></div>
  <div id="panel">
    <img class="bgimg" src="new_main/panel_main.png" alt="">
    <div class="in">
      <div id="pnPortWrap"><img id="pnPortBg" src="new_main/card_green_bg.png" alt=""><img id="pnPort" src="new_main/who_krox.png" alt=""></div>
      <div id="pnName">Krox</div>
      <div id="pnTraitRow"><img id="pnTraitIcon" src="new_main/Strong_green.png" alt=""><span id="pnTrait" class="engr">STRONG</span></div>
      <div id="pnDice"></div>
      <div id="pnStats">
        <div class="st"><span class="lb engr">TARGET</span><span class="vl ink" id="pnTarget">3,000</span></div>
        <div class="st"><span class="lb engr">STAKE</span><span class="vl ink" id="pnStake"></span></div>
        <div class="st"><span class="lb engr">POT</span><span class="vl ink" id="pnPot"></span></div>
      </div>
      <div id="pnSit" onclick="closePanel()">SIT DOWN</div>
    </div>
  </div>

  <!-- top chips -->
  <div id="hearts">
    <img src="new_main/heart_full.png" alt=""><img src="new_main/heart_full.png" alt=""><img src="new_main/heart_full.png" alt="">
  </div>
  <div id="goldplate">
    <img class="pl" src="new_main/plate_goldCounter.png" alt="">
    <img class="co" src="new_main/coin.png" alt="">
    <div class="amt">120g</div>
  </div>
  <div id="fontChip" onclick="cycleFont()">Aa</div>
</div>

<script>
/* colors are bound to the frame; traits always wear the frame's color;
   characters can sit in any frame. Double-click a card to demo GONE HOME. */
var SEATS=[
  {key:'krox', name:'Krox', color:'green', trait:'Strong', price:15, target:'3,000', pot:'+40g', dice:6, gone:false},
  {key:'eira', name:'Eira', color:'purple',trait:'Cunning',price:20, target:'2,600', pot:'+55g', dice:6, gone:false},
  {key:'nebb', name:'Nebb', color:'blue',  trait:'Lucky',  price:10, target:'2,200', pot:'+30g', dice:5, gone:false},
  {key:'regis',name:'Regis',color:'red',   trait:'Greedy', price:25, target:'3,400', pot:'+70g', dice:7, gone:false}
];

function renderCards(){
  var host=document.getElementById('cards');host.innerHTML='';
  SEATS.forEach(function(st,i){
    var d=document.createElement('div');
    d.className='card c'+(i+1)+' enter';
    d.innerHTML=
      '<div class="cwrap">'+
      '<img class="ly lbg" src="new_main/card_'+st.color+'_bg.png" alt="">'+
      '<img class="ly lback" src="new_main/card_'+st.color+'_back.png" alt="">'+
      '<img class="ly lwho" src="new_main/who_'+(st.gone?'gonehome':st.key)+'.png" alt="">'+
      '<img class="ly lffg" src="new_main/card_'+st.color+'_fg.png" alt="">'+
      '<div class="cname">'+st.name+'</div>'+
      '<div class="cprice">'+st.price+'</div>'+
      '<img class="cseal" src="new_main/'+st.trait+'_'+st.color+'.png" alt="">'+
      '</div>';
    d.onclick=function(){if(!st.gone)openPanel(st);};
    d.ondblclick=function(e){e.preventDefault();st.gone=!st.gone;renderCards();};
    host.appendChild(d);
  });
}

/* entry wave replay = re-entering the room (also dblclick the scene) */
function replayWave(){
  document.querySelectorAll('.card').forEach(function(c){
    c.classList.remove('enter');void c.offsetWidth;c.classList.add('enter');
  });
}
document.getElementById('fgL');
document.getElementById('stage').addEventListener('dblclick',function(e){
  if(!e.target.closest('.card')&&!e.target.closest('#panel'))replayWave();
});

/* wiggle + parallax: one rAF loop drives --wx/--wy per card; layers scale
   the motion by --f so the chrome floats over the backdrop. Pointer adds a
   soft parallax lean. */
var _px=0,_py=0,_sx=0,_sy=0;
addEventListener('pointermove',function(e){
  _px=(e.clientX/innerWidth-.5)*2;_py=(e.clientY/innerHeight-.5)*2;
});
var REDUCED=matchMedia('(prefers-reduced-motion:reduce)').matches;
function loop(t){
  _sx+=(_px-_sx)*.04;_sy+=(_py-_sy)*.04;
  document.querySelectorAll('.card').forEach(function(c,i){
    var ph=i*1.9,s=t/1000;
    var wx=Math.sin(s*.85+ph)*1.6+Math.sin(s*1.55+ph*1.7)*.8+_sx*5;
    var wy=Math.cos(s*.7+ph*1.3)*1.4+Math.sin(s*1.3+ph)*.7+_sy*4;
    c.style.setProperty('--wx',wx.toFixed(2)+'px');
    c.style.setProperty('--wy',wy.toFixed(2)+'px');
  });
  requestAnimationFrame(loop);
}
if(!REDUCED)requestAnimationFrame(loop);

/* panel */
function openPanel(st){
  document.getElementById('pnPortBg').src='new_main/card_'+st.color+'_bg.png';
  document.getElementById('pnPort').src='new_main/who_'+st.key+'.png';
  document.getElementById('pnName').textContent=st.name;
  document.getElementById('pnTraitIcon').src='new_main/'+st.trait+'_'+st.color+'.png';
  document.getElementById('pnTrait').textContent=st.trait.toUpperCase();
  var dc='';for(var i=0;i<st.dice;i++)dc+='<span class="pd"></span>';
  document.getElementById('pnDice').innerHTML=dc;
  document.getElementById('pnTarget').textContent=st.target;
  document.getElementById('pnStake').innerHTML='<img src="new_main/coin.png" alt="">'+st.price+'g';
  document.getElementById('pnPot').innerHTML='<img src="new_main/coin.png" alt="">'+st.pot;
  document.getElementById('scrim').classList.add('on');
  document.getElementById('panel').classList.add('on');
}
function closePanel(){
  document.getElementById('scrim').classList.remove('on');
  document.getElementById('panel').classList.remove('on');
}

/* mockup-only: body-font audition */
var BODY_FONTS=['Schwabacher','Requiem','Old Englished Boots','Black Castle','Gothica','Britannia'];
function cycleFont(){
  var st=document.getElementById('stage');
  var cur=(localStorage.bodyFont||'Schwabacher');
  var nxt=BODY_FONTS[(BODY_FONTS.indexOf(cur)+1)%BODY_FONTS.length];
  localStorage.bodyFont=nxt;
  st.style.setProperty('--bodyFont',"'"+nxt+"',serif");
  var chip=document.getElementById('fontChip');
  chip.textContent=nxt;
  clearTimeout(chip._t);chip._t=setTimeout(function(){chip.textContent='Aa';},1600);
}
if(localStorage.bodyFont)document.getElementById('stage').style.setProperty('--bodyFont',"'"+localStorage.bodyFont+"',serif");

renderCards();
</script>
</body>
</html>
