<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fark — Main Screen (painted mockup)</title>
<style>
@font-face{font-family:'Alagard';src:url('../Fonts/Pixel/alagard.ttf') format('truetype')}
@font-face{font-family:'Enchanted Land';src:url('../Fonts/Medieval/Enchanted Land.otf') format('opentype')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a0806;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}

/* ── the stage: a 9:16 canvas, everything positioned in % of it ── */
#stage{position:relative;height:100vh;aspect-ratio:9/16;max-width:100vw;overflow:hidden;background:#0a0806;--u:1vh}
#stage>img.env{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}

/* scene sandwich: bg → grog → table-front → frames → foreground → chips */
#grog{position:absolute;left:6%;top:18.4%;width:66%;z-index:2;pointer-events:none;
  filter:drop-shadow(0 10px 24px rgba(0,0,0,.45))}
#tableL{z-index:3}
#fgL{z-index:6}

/* ── patron frames (2×2) ── */
.pframe{position:absolute;width:37.5%;aspect-ratio:2290/2462;z-index:5;cursor:pointer;transition:transform .09s}
.pframe:active{transform:scale(.975)}
.pframe img{position:absolute;display:block;pointer-events:none}
.pframe .who{inset:0;width:100%;height:100%;object-fit:contain}
.pframe .fr{inset:0;width:100%;height:100%;object-fit:contain;
  filter:drop-shadow(0 10px 18px rgba(0,0,0,.55))}
/* the price tag hangs off the left-post hook */
.pframe .tag{left:-11%;top:29.5%;width:32%;transform:rotate(-3deg);
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.pframe .tagtxt{position:absolute;left:-8.5%;top:44%;width:27%;text-align:center;
  transform:rotate(-3.5deg);font-family:'Alagard',serif;font-size:calc(var(--u)*2.6);
  color:#4a3115;pointer-events:none}
/* name strip (baked into the frame art, text overlays it) */
.pframe .strap{position:absolute;left:14%;right:14%;bottom:4%;height:12%;display:flex;
  align-items:center;justify-content:center;pointer-events:none;
  font-family:'Alagard',serif;font-size:calc(var(--u)*3.2);color:#4a3115;letter-spacing:1px}
.f1{left:9.5%;top:44.2%}
.f2{left:53%;top:45.4%}
.f3{left:10.3%;top:67.6%}
.f4{left:53.4%;top:68.4%;width:36.2%;aspect-ratio:2131/2393}

/* ── top chips ── */
#hearts{position:absolute;left:3.6%;top:1.8%;z-index:8;display:flex;gap:3.5%;width:27%}
#hearts img{width:30%;filter:drop-shadow(0 3px 5px rgba(0,0,0,.55))}
#goldplate{position:absolute;right:3.2%;top:1.8%;width:27.5%;z-index:8}
#goldplate .pl{width:100%;display:block;filter:drop-shadow(0 3px 6px rgba(0,0,0,.55))}
#goldplate .co{position:absolute;left:6.5%;top:50%;width:17.5%;transform:translateY(-50%);
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
#goldplate .amt{position:absolute;left:26%;right:8%;top:0;bottom:0;display:flex;align-items:center;justify-content:center;
  font-family:'Alagard',serif;font-size:calc(var(--u)*5.6);color:#f3dfa6;letter-spacing:1px;
  text-shadow:0 2px 3px rgba(0,0,0,.7)}
</style>
</head>
<body>
<div id="stage">
  <img class="env" id="bgL" src="new_main/bg.png" alt="">
  <img id="grog" src="new_main/grog.png" alt="">
  <img class="env" id="tableL" src="new_main/table.png" alt="">

  <!-- four seats: three patrons in, one gone home -->
  <div class="pframe f1">
    <img class="who" src="new_main/patron_hog.png" alt="">
    <img class="fr" src="new_main/frame_v1.png" alt="">
    <img class="tag" src="new_main/tag.png" alt=""><span class="tagtxt"></span>
    <span class="strap"></span>
  </div>
  <div class="pframe f2">
    <img class="who" src="new_main/patron_toucan.png" alt="">
    <img class="fr" src="new_main/frame_v2.png" alt="">
    <img class="tag" src="new_main/tag.png" alt=""><span class="tagtxt"></span>
    <span class="strap"></span>
  </div>
  <div class="pframe f3">
    <img class="who" src="new_main/patron_lizard.png" alt="">
    <img class="fr" src="new_main/frame_v2.png" alt="">
    <img class="tag" src="new_main/tag.png" alt=""><span class="tagtxt"></span>
    <span class="strap"></span>
  </div>
  <div class="pframe f4">
    <img class="fr" src="new_main/frame_gone.png" alt="">
  </div>

  <img class="env" id="fgL" src="new_main/fg.png" alt="">

  <!-- top chips -->
  <div id="hearts">
    <img src="new_main/heart_full.png" alt=""><img src="new_main/heart_full.png" alt=""><img src="new_main/heart_full.png" alt="">
  </div>
  <div id="goldplate">
    <img class="pl" src="new_main/plate_goldCounter.png" alt="">
    <img class="co" src="new_main/coin.png" alt="">
    <div class="amt">120g</div>
  </div>
</div>
</body>
</html>
