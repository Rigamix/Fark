# Deploy Fark to GitHub Pages via Actions, replacing the legacy branch builder.
#
# WHY: the legacy "pages build and deployment" builder failed repeatedly on
# 2026-08-06, leaving the live site 8 commits stale. Routing through Actions
# identified the real cause - the deployment reaches `deployment_in_progress`
# and burns the full 600s. deploy-pages CAPS `timeout` at 600000 ms ("timeout
# value is greater than the allowed maximum"), so 10 minutes is a hard limit and
# the only cure is a smaller published site.
name: Deploy Pages

on:
  push:
    branches: [fark]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a newer push wins rather than queueing behind an
# older one until it times out.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage only what the site serves
        run: |
          set -e
          mkdir -p _site
          # the only two trees the game references - 65 and 32 refs
          cp -r Art _site/Art
          cp -r assets _site/assets
          for f in index.html fark_proto.html throw_lab.html manifest.json sw.js .nojekyll; do
            if [ -f "$f" ]; then cp "$f" _site/; else echo "skip missing $f"; fi
          done

          # Source formats no browser can render. Zero reference risk.
          find _site -type f \( -iname '*.psd' -o -iname '*.zip' -o -iname '*.ai' \) -delete

          # The 9 standalone design pages in _mockups: every one measured refs=0
          # from fark_proto.html / index.html / sw.js. Pages you navigate to, not
          # assets the game loads.
          rm -f _site/assets/_mockups/*.html

          # props/: 1.1 MB, measured refs=0, confirmed old.
          rm -rf _site/assets/_mockups/props

          # NOT new_main, despite the directory it lives in. It holds
          # JMH Beda.ttf, loaded by a live @font-face, and the game's
          # `mockups:'assets/_mockups/new_main/'` prefix appends names to it at
          # runtime - so which of its 65 files load cannot be enumerated
          # statically. Misnamed, not redundant. Deleting it kills a font.

          echo "staged $(find _site -type f | wc -l) files, $(du -sm _site | cut -f1) MB"

      - name: Compress the staged images
        run: |
          set -e
          # RULED: "optimize whatever hasn't been optimized and work with those".
          #
          # Done on the STAGED COPY, never in Art/ - the source art is untouched
          # and every filename is preserved, so the runtime-assembled paths keep
          # resolving. Backgrounds/MAIN/<NAME>/<Name>_env_BG.png is built from
          # the boss key at runtime; a static reachability audit could not see it
          # and came within one sanity check of deleting live art. Compressing in
          # place sidesteps that class entirely: nothing renamed, nothing removed.
          #
          # Measured on the branch: 254 optimized webp (15.2 MB) already sit
          # beside 242 masters (102.1 MB), and 39 masters (16.8 MB) have no twin.
          # One in-place pass covers both instead of maintaining a second set of
          # names plus a rewrite layer to reach them.
          #
          # THE FIRST VERSION OF THIS STEP SILENTLY DID NOTHING. It logged
          # "200 MB -> 200 MB", which reads as "ran, nothing to do" and actually
          # meant "never ran": a mangled line continuation left a literal \n in
          # the command, and `2>/dev/null || true` swallowed the error. Errors
          # are no longer hidden, and an unchanged size now warns.
          sudo apt-get update -qq
          sudo apt-get install -y pngquant
          pngquant --version
          echo "PNG files to process: $(find _site -type f -iname '*.png' | wc -l)"
          BEFORE=$(du -sm _site | cut -f1)
          find _site -type f -iname '*.png' -print0 | xargs -0 -r -P 4 -n 25 pngquant --force --skip-if-larger --ext .png --quality 50-88 || echo "pngquant returned $? (per-file skips are expected)"
          AFTER=$(du -sm _site | cut -f1)
          echo "IMAGE COMPRESSION: ${BEFORE} MB -> ${AFTER} MB"
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "::warning::compression changed nothing - this step is not working"
          fi
          if [ "$AFTER" -gt 150 ]; then
            echo "::warning::staged site is ${AFTER} MB - deploy may still time out"
          fi

      - name: Fail if the game itself did not make it
        run: |
          test -f _site/fark_proto.html || { echo "fark_proto.html missing"; exit 1; }
          test -f _site/index.html      || { echo "index.html missing"; exit 1; }
          test -d _site/Art             || { echo "Art/ missing"; exit 1; }
          test -d _site/assets          || { echo "assets/ missing"; exit 1; }
          test -f "_site/assets/_mockups/new_main/JMH Beda.ttf" || { echo "the live font was deleted"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        # No timeout setting: it is capped at 600000 ms and raising it only logs
        # "timeout value is greater than the allowed maximum". A smaller site is
        # the only lever.
