# Deploy Fark to GitHub Pages via Actions, replacing the legacy branch builder.
#
# WHY: the legacy "pages build and deployment" builder failed 8 times running on
# 2026-08-06, always instantly (duration 0) with a generic "Page build failed",
# leaving the live site 8 commits stale. It was not content - the same tree built
# at 11:01 and 11:54 and failed at 11:17 and 11:37 - and GitHub reported all
# systems operational. Failures clustered whenever pushes came close together and
# successes always followed a gap, so it reads as contention on that builder.
#
# This path does not use that builder at all. It also fixes the underlying
# behaviour rather than working around it:
#
#   concurrency + cancel-in-progress  a rapid second push CANCELS the first run
#                                     instead of queueing behind it until the
#                                     deploy step times out after 10 minutes
#   staged _site                      publishes only what the game actually
#                                     serves. tools/, docs/, _old/ and .claude/
#                                     were all being published and none is
#                                     referenced - .claude/settings.local.json
#                                     especially had no business being public.
name: Deploy Pages

on:
  push:
    branches: [fark]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a newer push wins rather than waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage only what the site serves
        run: |
          set -e
          mkdir -p _site
          # the two the game actually references - 65 and 32 refs respectively
          cp -r Art _site/Art
          cp -r assets _site/assets
          # root entry points
          for f in index.html fark_proto.html throw_lab.html manifest.json sw.js .nojekyll; do
            [ -f "$f" ] && cp "$f" _site/ || echo "skip missing $f"
          done
          # 16.0 MB of formats no browser can render. Zero reference risk -
          # nothing can be <img src="x.psd">. NOT touching assets/_mockups/
          # despite its 35.8 MB: .nojekyll exists precisely because Jekyll once
          # excluded it and 404'd the JMH Beda font, hearts and gold plate on a
          # real phone test. It is live content, not mockups.
          find _site \( -iname '*.psd' -o -iname '*.zip' -o -iname '*.ai' \) -delete
          # The 9 standalone design pages in _mockups: 16.1 MB, and every one
          # measured at refs=0 from fark_proto.html / index.html / sw.js. They
          # are pages you navigate to, not assets the game loads - so removing
          # them cannot break the game. Their IMAGES stay (see above).
          rm -f _site/assets/_mockups/*.html
          echo "staged $(find _site -type f | wc -l) files, $(du -sm _site | cut -f1) MB"

      - name: Fail if the game itself did not make it
        run: |
          test -f _site/fark_proto.html || { echo "fark_proto.html missing from _site"; exit 1; }
          test -f _site/index.html      || { echo "index.html missing from _site"; exit 1; }
          test -d _site/Art             || { echo "Art/ missing from _site"; exit 1; }
          test -d _site/assets          || { echo "assets/ missing from _site"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        # NO TIMEOUT SETTING - it is capped and cannot help. Raising it to
        # 1800000 produced:
        #   "timeout value is greater than the allowed maximum - timeout set to
        #    the maximum of 600000 milliseconds"
        # 10 minutes is a HARD limit on deploy-pages. The deployment reaches
        # `deployment_in_progress` and simply does not finish in that window, so
        # the only cure is a smaller site - see the staging step above.
