function openSettings(){
  document.getElementById('settingsBackdrop').classList.add('on');
  document.getElementById('settingsSheet').classList.add('open');
  initSettingsUI();
  requestAnimationFrame(function(){requestAnimationFrame(_renderSettingsCanvases)});
}
function closeSettings(){
  document.getElementById('settingsBackdrop').classList.remove('on');
  document.getElementById('settingsSheet').classList.remove('open');
}
function _renderSettingsCanvases(){
  var sheet=document.getElementById('settingsSheet');
  var dc=document.getElementById('settingsCanvas');
  var sw=sheet.offsetWidth,sh=sheet.offsetHeight;
  if(sw<2||sh<2)return;
  dc.width=sw;dc.height=sh;dc.style.width='100%';dc.style.height='100%';
  drawPixelPanel(dc,'#7a6a50','#28221c','#141210',8311,0.003);
  sheet.querySelectorAll('.set-row canvas').forEach(function(c,i){
    var box=c.parentElement;var bw=box.offsetWidth,bh=box.offsetHeight;
    if(bw<2||bh<2)return;
    c.width=bw;c.height=bh;c.style.width='100%';c.style.height='100%';
    drawPixelPanel(c,'#5a5040','#1e1a16','#0e0c0a',8311+i*433,0.008);
  });
  sheet.querySelectorAll('.settings-actions .sbtn canvas').forEach(function(c,i){
    var btn=c.parentElement;var bw=btn.offsetWidth,bh=btn.offsetHeight;
    if(bw<2||bh<2)return;
    c.width=bw;c.height=bh;c.style.width='100%';c.style.height='100%';
    var isGold=i===1;
    drawPixelPanel(c,isGold?'#6a5830':'#4a3838',isGold?'#1a1408':'#1e1414',isGold?'#0e0a04':'#100808',8311+700+i*199,0.008);
  });
}
function initSettingsUI(){
  const style=(S.settings&&S.settings.diceStyle)||'2d';
  updateDiceStyleUI(style);
  updateAudioUI();
}
function cycleDiceStyle(){
  const current=(S.settings&&S.settings.diceStyle)||'2d';
  const next=current==='2d'?'3d':'2d';
  if(!S.settings)S.settings={};
  S.settings.diceStyle=next;
  save();
  updateDiceStyleUI(next);
}
function updateDiceStyleUI(style){
  const slider=document.getElementById('st-slider');
  const opt2d=document.getElementById('st-2d');
  const opt3d=document.getElementById('st-3d');
  const note=document.getElementById('diceStyleNote');
  if(style==='3d'){
    slider.style.left='calc(50% + 2px)';
    opt2d.classList.remove('active');
    opt3d.classList.add('active');
    note.textContent='PHYSICS ON \u2014 DICE BOUNCE & SCATTER';
  }else{
    slider.style.left='2px';
    opt2d.classList.add('active');
    opt3d.classList.remove('active');
    note.textContent='PHYSICS OFF \u2014 CLASSIC GRID DICE';
  }
}
function toggleAudio(type){
  if(!S.settings)S.settings={};
  if(type==='music'){S.settings.music=!(S.settings.music!==false);}
  else{S.settings.sfx=!(S.settings.sfx!==false);}
  save();
  updateAudioUI();
}
function updateAudioUI(){
  const musicOn=!S.settings||S.settings.music!==false;
  const sfxOn=!S.settings||S.settings.sfx!==false;
  const mc=document.getElementById('musicCheck');
  const sc=document.getElementById('sfxCheck');
  if(mc)mc.classList.toggle('on',musicOn);
  if(sc)sc.classList.toggle('on',sfxOn);
}
function resetRun(){
  var ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;z-index:9800;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:20px';
  ov.innerHTML='<div style="background:#28221c;border:2px solid #a05050;border-radius:4px;padding:22px 18px;max-width:300px;width:100%;text-align:center;font-family:var(--font-px)">'
    +'<div style="font-family:MedievalSharp,serif;font-size:20px;color:#a05050;letter-spacing:2px;margin-bottom:14px">Start Over?</div>'
    +'<div style="font-size:8px;color:var(--textdim);line-height:2.2;margin-bottom:18px">All progress will be lost.<br>Gold, cards, dice \u2014 everything.</div>'
    +'<div style="display:flex;gap:10px;justify-content:center">'
    +'<div id="reset-yes" style="flex:1;padding:14px 6px;cursor:pointer;font-family:var(--font-px);font-size:10px;text-align:center;background:#1e1414;border:2px solid #4a3838;border-radius:3px;color:var(--red);letter-spacing:1px">CONFIRM</div>'
    +'<div id="reset-no" style="flex:1;padding:14px 6px;cursor:pointer;font-family:var(--font-px);font-size:10px;text-align:center;background:#1a1408;border:2px solid #6a5830;border-radius:3px;color:var(--gold);letter-spacing:1px">BACK</div>'
    +'</div></div>';
  document.body.appendChild(ov);
  document.getElementById('reset-yes').onclick=function(){localStorage.removeItem('gambit4');window.location.href='menu.html';};
  document.getElementById('reset-no').onclick=function(){ov.remove();};
  ov.onclick=function(e){if(e.target===ov)ov.remove();};
}
